<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Docket</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
  html, body, #root { min-height: 100%; }
  body { margin: 0; background: #14181B; }
  .docket-root { font-family: 'IBM Plex Sans', ui-sans-serif, system-ui; }
  .font-display { font-family: 'Fraunces', ui-serif, serif; }
  .font-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .docket-root *:focus-visible { outline: 2px solid #D98E3F; outline-offset: 2px; }
  .task-card { transition: transform 150ms ease, box-shadow 150ms ease; }
  .task-card:hover { transform: translateY(-2px); }
  .drag-handle { cursor: grab; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .board-col.sortable-ghost { opacity: 0.35; }
  .board-col.sortable-chosen { box-shadow: 0 0 0 2px #D98E3F; }
  .task-drag-handle { cursor: grab; user-select: none; }
  .task-drag-handle:active { cursor: grabbing; }
  .task-card.sortable-ghost { opacity: 0.4; }
  .task-card.sortable-chosen { box-shadow: 0 0 0 2px #D98E3F; }
  .career-wedge path { transition: opacity 180ms ease, filter 180ms ease; }
  .career-wedge.dim:hover path { filter: brightness(1.35); }
  .career-item { transition: box-shadow 150ms ease; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- tiny inline icon set (no external icon library needed) ---------- */

  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
         strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {children}
    </svg>

}

  <IconBase size={size}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></IconBase>
);
const Clock = ({ size }) => (
  <IconBase size={size}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></IconBase>
);
const Plus = ({ size }) => (

);
const ChevronDown = ({ size }) => <IconBase size={size}><polyline points="6 9 12 15 18 9" /></IconBase>;
const ChevronUp = ({ size }) => <IconBase size={size}><polyline points="18 15 12 9 6 15" /></IconBase>;

const PencilIcon = ({ size }) => (

    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />

const PhoneIcon = ({ size }) => (
  <IconBase size={size}>
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z" />
  </IconBase>
);
const MailIcon = ({ size }) => (
  <IconBase size={size}>
    <rect x="2" y="4" width="20" height="16" rx="2" />
    <path d="m22 6-10 7L2 6" />
  </IconBase>
);

/* ---------- data + logic ---------- */
const COLORS = {
  ink: '#14181B',
  inkPanel: '#1B2023',
  inkPanelBorder: '#2C3336',
  paper: '#FAF7F0',
  paperDim: '#F0ECE1',
  textInk: '#211F1A',
  textOnDark: '#EDE8DA',
  textMuted: '#93999B',
  textMutedOnPaper: '#7A756A',
  amber: '#D98E3F',
  rust: '#B5473A',
  moss: '#5C7A5E',
  stone: '#767169',
  call: '#4B7BA6',
  schedule: '#6B5FA6',
  jhu: '#2F6F9E',
  mstc: '#A6753D',
};

const CATEGORIES = [
  { key: 'work', label: 'Work', color: '#2E294E', text: '#FAF7F0', accent: '#3F8C82' },
  { key: 'personal', label: 'Personal', color: '#F1E9DA', text: '#211F1A', accent: '#B75D8C' },
  { key: 'jhu', label: 'JHU', color: '#2F6F9E', text: '#FAF7F0', accent: COLORS.jhu },
  { key: 'mstc', label: 'MSTC', color: '#A6753D', text: '#FAF7F0', accent: COLORS.mstc },
];

const DAY_MS = 1000 * 60 * 60 * 24;
const STORAGE_KEY = 'docket-tasks';

function agingBonus(createdAt) {
  const days = (Date.now() - createdAt) / DAY_MS;
  return Math.min(days * 0.15, 3);
}

function score(task) {
  return task.pushCount * 3 + agingBonus(task.createdAt);
}

function categoryOf(key) {
  return CATEGORIES.find((c) => c.key === key) || CATEGORIES[0];
}

function hexLuminance(hex) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substring(0, 2), 16) / 255;
  const g = parseInt(c.substring(2, 4), 16) / 255;
  const b = parseInt(c.substring(4, 6), 16) / 255;
  return 0.299 * r + 0.587 * g + 0.114 * b;
}

function textColorForHex(hex) {
  return hexLuminance(hex) > 0.55 ? '#211F1A' : '#FAF7F0';
}

function loadTasks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveTasks(tasks) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch (e) {}
}

/* ---------- journal entries: separate from tasks entirely, their own
   storage key, their own shape (just text + a timestamp). ---------- */
const JOURNAL_STORAGE_KEY = 'docket-journal';

function loadJournal() {
  try {
    const raw = localStorage.getItem(JOURNAL_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveJournal(entries) {
  try {
    localStorage.setItem(JOURNAL_STORAGE_KEY, JSON.stringify(entries));
  } catch (e) {}
}

function normalizeJournalEntry(e, idx) {
  return {
    id: e.id || `${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 6)}`,
    text: String(e.text || ''),
    createdAt: Number(e.createdAt) || Date.now(),
  };
}

/* ---------- career pane: companies, roles, contacts, dragonflies. Its own
   storage key and shapes, entirely outside tasks and scoring. Roles and
   contacts can point at a company by id. ---------- */
const CAREER_STORAGE_KEY = 'docket-career';

// Simon layout: companies top-left, roles top-right, dragonflies bottom-right,
// contacts bottom-left. Angles are SVG degrees (0 = east, clockwise).
const CAREER_TYPES = [
  { key: 'companies', label: 'Companies', one: 'company', nameLabel: 'Name', placeholder: 'name', color: COLORS.rust, a0: 180, a1: 270 },
  { key: 'roles', label: 'Roles', one: 'role', nameLabel: 'Title', placeholder: 'title', color: COLORS.amber, a0: 270, a1: 360 },
  { key: 'dragonflies', label: 'Dragonflies', one: 'dragonfly', nameLabel: 'Idea', placeholder: 'idea', color: COLORS.call, a0: 0, a1: 90 },
  { key: 'contacts', label: 'Contacts', one: 'contact', nameLabel: 'Name', placeholder: 'name', color: COLORS.moss, a0: 90, a1: 180 },
];

const CAREER_FIELDS = {
  companies: [['why', 'Why interested'], ['link', 'Link'], ['notes', 'Notes', true]],
  roles: [['url', 'Posting URL'], ['notes', 'Notes', true]],
  contacts: [['how', 'How you know them'], ['reach', 'How to reach'], ['notes', 'Notes', true]],
  dragonflies: [['notes', 'Note', true]],
};

const LINKABLE = ['roles', 'contacts'];

const emptyCareer = () => ({ companies: [], roles: [], contacts: [], dragonflies: [] });

function careerCount(c) {
  return c.companies.length + c.roles.length + c.contacts.length + c.dragonflies.length;
}

function normalizeCareer(raw) {
  const src = raw && typeof raw === 'object' ? raw : {};
  const list = (k) => (Array.isArray(src[k]) ? src[k] : []);
  const base = (x, i) => ({
    id: x.id ? String(x.id) : `${Date.now()}-${i}-${Math.random().toString(36).slice(2, 6)}`,
    name: String(x.name || 'Untitled'),
    notes: String(x.notes || ''),
    createdAt: Number(x.createdAt) || Date.now(),
  });
  const companies = list('companies').map((x, i) => ({ ...base(x, i), why: String(x.why || ''), link: String(x.link || '') }));
  const ids = new Set(companies.map((c) => c.id));
  const co = (v) => (v != null && ids.has(String(v)) ? String(v) : null);
  return {
    companies,
    roles: list('roles').map((x, i) => ({ ...base(x, i), company: co(x.company), url: String(x.url || '') })),
    contacts: list('contacts').map((x, i) => ({ ...base(x, i), company: co(x.company), how: String(x.how || ''), reach: String(x.reach || '') })),
    dragonflies: list('dragonflies').map((x, i) => base(x, i)),
  };
}

function loadCareer() {
  try {
    const raw = localStorage.getItem(CAREER_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveCareer(career) {
  try {
    localStorage.setItem(CAREER_STORAGE_KEY, JSON.stringify(career));
  } catch (e) {}
}

const BOARD_UI_KEY = 'docket-board-ui';

function loadBoardUI() {
  try {
    const raw = localStorage.getItem(BOARD_UI_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {};
}

function saveBoardUI(ui) {
  try {
    localStorage.setItem(BOARD_UI_KEY, JSON.stringify(ui));
  } catch (e) {}
}

/* ---------- task drag-to-reorder ---------- */
const TASK_ORDER_KEY = 'docket-task-order';
const TASK_ORDER_LIST_KEY = 'docket-task-order-list';
const TASK_ORDER_HOMEWORK_LIST_KEY = 'docket-task-order-homework-list';

function loadOrderMap(key) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveOrderMap(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

function mergeManualOrder(persistedIds, naturalOrderTasks) {
  const byId = {};
  const rankById = {};
  naturalOrderTasks.forEach((t, idx) => {
    byId[t.id] = t;
    rankById[t.id] = idx;
  });
  const ordered = (persistedIds || []).filter((id) => byId[id]);
  const placed = new Set(ordered);
  naturalOrderTasks.forEach((t) => {
    if (placed.has(t.id)) return;
    let precedingId = null;
    for (let i = rankById[t.id] - 1; i >= 0; i--) {
      const candidateId = naturalOrderTasks[i].id;
      if (placed.has(candidateId)) {
        precedingId = candidateId;
        break;
      }
    }
    const insertAt = precedingId ? ordered.indexOf(precedingId) + 1 : 0;
    ordered.splice(insertAt, 0, t.id);
    placed.add(t.id);
  });
  return ordered.map((id) => byId[id]);
}

function normalizeTask(t, idx) {
  let category = t.category || 'work';
  if (!CATEGORIES.some((c) => c.key === category)) category = 'work';
  return {
    id: t.id || `${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 6)}`,
    title: String(t.title || 'Untitled'),
    category,
    phone: t.phone || (t.contactMethod === 'phone' ? t.contactValue : '') || (t.isCall ? t.callContact : '') || '',
    email: t.email || (t.contactMethod === 'email' ? t.contactValue : '') || '',
    pushCount: Number(t.pushCount) || 0,
    completed: !!t.completed,
    createdAt: Number(t.createdAt) || Date.now(),
    snoozedDay: t.snoozedDay || null,
    scheduledDate: t.scheduledDate || null,
  };
}

/* ---------- app ---------- */
function Docket() {
  const [tasks, setTasks] = useState([]);
  const [journalEntries, setJournalEntries] = useState([]);
  const [journalMode, setJournalMode] = useState(false);
  const [journalDraft, setJournalDraft] = useState('');
  const [loaded, setLoaded] = useState(false);
  const [today] = useState(() => new Date().toDateString());
  const [filterCategory, setFilterCategory] = useState(null);
  const [viewMode, setViewMode] = useState('columns');
  const [showDone, setShowDone] = useState(false);
  const [showFormDetails, setShowFormDetails] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);
  const [pendingImport, setPendingImport] = useState(null);
  const [importError, setImportError] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const fileInputRef = useRef(null);
  const columnSortRef = useRef(null);
  const taskListRefs = useRef({});
  const listSortRef = useRef(null);
  const [form, setForm] = useState({ title: '', category: 'work', phone: '', email: '', scheduledDate: null });
  const [columnOrder, setColumnOrder] = useState(() => {
    const saved = loadBoardUI().order;
    return Array.isArray(saved) && saved.length ? saved : CATEGORIES.map((c) => c.key);
  });
  const [collapsedCols, setCollapsedCols] = useState(() => loadBoardUI().collapsed || {});
  const [taskOrder, setTaskOrder] = useState({});
  const [taskOrderList, setTaskOrderList] = useState([]);
  const [taskOrderHomeworkList, setTaskOrderHomeworkList] = useState([]);
  const homeworkListSortRef = useRef(null);
  // Career pane. careerLit is the lit wedge (null = task board showing);
  // careerSel is the selected company, which scopes roles/contacts.
  const [career, setCareer] = useState(emptyCareer);
  const [careerLit, setCareerLit] = useState(null);
  const [careerSel, setCareerSel] = useState(null);
  const [careerOpenId, setCareerOpenId] = useState(null);

  useEffect(() => {
    const stored = loadTasks();
    setTasks((stored || []).map((t, i) => normalizeTask(t, i)));
    const storedJournal = loadJournal();
    setJournalEntries((storedJournal || []).map((e, i) => normalizeJournalEntry(e, i)));
    const storedOrder = loadOrderMap(TASK_ORDER_KEY);
    if (storedOrder) setTaskOrder(storedOrder);
    const storedOrderList = loadOrderMap(TASK_ORDER_LIST_KEY);
    if (Array.isArray(storedOrderList)) setTaskOrderList(storedOrderList);
    const storedOrderHomeworkList = loadOrderMap(TASK_ORDER_HOMEWORK_LIST_KEY);
    if (Array.isArray(storedOrderHomeworkList)) setTaskOrderHomeworkList(storedOrderHomeworkList);
    setCareer(normalizeCareer(loadCareer()));
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    saveCareer(career);
  }, [career, loaded]);

  // Esc closes the career pane and returns to the board.
  useEffect(() => {
    if (!careerLit) return;
    const onKey = (e) => { if (e.key === 'Escape') { setCareerLit(null); setCareerOpenId(null); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [careerLit]);

  useEffect(() => {
    if (!loaded) return;
    saveTasks(tasks);
  }, [tasks, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveJournal(journalEntries);
  }, [journalEntries, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveOrderMap(TASK_ORDER_KEY, taskOrder);
  }, [taskOrder, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveOrderMap(TASK_ORDER_LIST_KEY, taskOrderList);
  }, [taskOrderList, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveOrderMap(TASK_ORDER_HOMEWORK_LIST_KEY, taskOrderHomeworkList);
  }, [taskOrderHomeworkList, loaded]);

  useEffect(() => {
    saveBoardUI({ order: columnOrder, collapsed: collapsedCols });
  }, [columnOrder, collapsedCols]);

  useEffect(() => {
    if (viewMode !== 'columns' || typeof Sortable === 'undefined' || !columnSortRef.current) return;
    const sortable = Sortable.create(columnSortRef.current, {
      handle: '.drag-handle',
      animation: 150,
      onEnd: () => {
        const ids = [...columnSortRef.current.querySelectorAll('[data-card]')].map((el) => el.getAttribute('data-card'));
        setColumnOrder(ids);
      },
    });
    return () => sortable.destroy();
  }, [viewMode, careerLit]);

  useEffect(() => {
    if (viewMode !== 'columns' || typeof Sortable === 'undefined') return;
    const keys = CATEGORIES.map((c) => c.key);
    const instances = keys
      .map((key) => {
        const el = taskListRefs.current[key];
        if (!el) return null;
        return Sortable.create(el, {
          handle: '.task-drag-handle',
          animation: 150,
          onEnd: () => {
            const ids = [...el.querySelectorAll('[data-task-id]')].map((n) => n.getAttribute('data-task-id'));
            setTaskOrder((prev) => ({ ...prev, [key]: ids }));
          },
        });
      })
      .filter(Boolean);
    return () => instances.forEach((inst) => inst.destroy());
  }, [viewMode, collapsedCols, careerLit]);

  useEffect(() => {
    if (viewMode !== 'list' || typeof Sortable === 'undefined') return;
    const instances = [];
    if (listSortRef.current) {
      const el = listSortRef.current;
      instances.push(
        Sortable.create(el, {
          handle: '.task-drag-handle',
          animation: 150,
          onEnd: () => {
            const ids = [...el.querySelectorAll('[data-task-id]')].map((n) => n.getAttribute('data-task-id'));
            setTaskOrderList(ids);
          },
        })
      );
    }
    if (homeworkListSortRef.current) {
      const el = homeworkListSortRef.current;
      instances.push(
        Sortable.create(el, {
          handle: '.task-drag-handle',
          animation: 150,
          onEnd: () => {
            const ids = [...el.querySelectorAll('[data-task-id]')].map((n) => n.getAttribute('data-task-id'));
            setTaskOrderHomeworkList(ids);
          },
        })
      );
    }
    return () => instances.forEach((inst) => inst.destroy());
  }, [viewMode, careerLit]);

  const toggleCareerWedge = (key) => {
    setCareerLit((l) => (l === key ? null : key));
    setCareerOpenId(null);
  };

  const addCareerItem = (type, name) => {
    const base = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, name, notes: '', createdAt: Date.now() };
    const extra =
      type === 'companies' ? { why: '', link: '' }
      : type === 'roles' ? { company: careerSel, url: '' }
      : type === 'contacts' ? { company: careerSel, how: '', reach: '' }
      : {};
    setCareer((prev) => ({ ...prev, [type]: [{ ...base, ...extra }, ...prev[type]] }));
  };

  const updateCareerItem = (type, id, patch) =>
    setCareer((prev) => ({ ...prev, [type]: prev[type].map((x) => (x.id === id ? { ...x, ...patch } : x)) }));

  // Deleting a company doesn't delete its roles or contacts — they stay, unlinked.
  const deleteCareerItem = (type, id) => {
    setCareer((prev) => {
      const next = { ...prev, [type]: prev[type].filter((x) => x.id !== id) };
      if (type === 'companies') {
        LINKABLE.forEach((k) => {
          next[k] = prev[k].map((x) => (x.company === id ? { ...x, company: null } : x));
        });
      }
      return next;
    });
    if (type === 'companies' && careerSel === id) setCareerSel(null);
    if (careerOpenId === id) setCareerOpenId(null);
  };

  const toggleColumnCollapse = (key) => setCollapsedCols((prev) => ({ ...prev, [key]: !prev[key] }));

  const isSnoozedToday = (task) => task.snoozedDay === today;

  const addTask = () => {
    if (!form.title.trim()) return;
    const t = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      title: form.title.trim(),
      category: form.category,
      phone: form.phone.trim(),
      email: form.email.trim(),
      pushCount: 0,
      completed: false,
      createdAt: Date.now(),
      snoozedDay: null,
      scheduledDate: form.scheduledDate,
    };
    setTasks((prev) => [...prev, t]);
    setForm({ title: '', category: 'work', phone: '', email: '', scheduledDate: null });
  };

  const addJournalEntry = () => {
    if (!journalDraft.trim()) return;
    const entry = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      text: journalDraft.trim(),
      createdAt: Date.now(),
    };
    setJournalEntries((prev) => [...prev, entry]);
    setJournalDraft('');
  };

  const updateJournalEntry = (id, text) =>
    setJournalEntries((prev) => prev.map((e) => (e.id === id ? { ...e, text } : e)));

  const deleteJournalEntry = (id) => setJournalEntries((prev) => prev.filter((e) => e.id !== id));

  const toggleComplete = (id) =>
    setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t)));

  const deleteTask = (id) => setTasks((prev) => prev.filter((t) => t.id !== id));

  const pushTask = (id) =>
    setTasks((prev) =>
      prev.map((t) => (t.id === id ? { ...t, pushCount: t.pushCount + 1, snoozedDay: today } : t))
    );

  const startEdit = (task) => {
    setEditingId(task.id);
    setEditDraft({
      title: task.title,
      category: task.category,
      phone: task.phone || '',
      email: task.email || '',
      scheduledDate: task.scheduledDate || null,
    });
  };

  const cancelEdit = () => {
    setEditingId(null);
    setEditDraft(null);
  };

  const saveEdit = () => {
    if (!editDraft || !editDraft.title.trim()) return;
    setTasks((prev) =>
      prev.map((t) =>
        t.id === editingId
          ? {
              ...t,
              title: editDraft.title.trim(),
              category: editDraft.category,
              phone: editDraft.phone.trim(),
              email: editDraft.email.trim(),
              scheduledDate: editDraft.scheduledDate,
            }
          : t
      )
    );
    setEditingId(null);
    setEditDraft(null);
  };

  const exportBackup = () => {
    // v2 backup: one object carrying tasks, journal and career. Older backups
    // (a bare array of tasks) still import — see handleFileSelected.
    const payload = { app: 'docket', version: 2, exportedAt: new Date().toISOString(), tasks, journal: journalEntries, career };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `docket-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const triggerImport = () => {
    setImportError(null);
    fileInputRef.current && fileInputRef.current.click();
  };

  const handleFileSelected = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        let next;
        if (Array.isArray(parsed)) {
          next = { tasks: parsed.map((t, idx) => normalizeTask(t, idx)), journal: null, career: null };
        } else if (parsed && Array.isArray(parsed.tasks)) {
          next = {
            tasks: parsed.tasks.map((t, idx) => normalizeTask(t, idx)),
            journal: Array.isArray(parsed.journal) ? parsed.journal.map((j, idx) => normalizeJournalEntry(j, idx)) : null,
            career: parsed.career ? normalizeCareer(parsed.career) : null,
          };
        } else {
          throw new Error('unrecognized backup');
        }
        setPendingImport(next);
        setImportError(null);
      } catch (err) {
        setImportError("That file doesn't look like a Docket backup.");
      }
    };
    reader.onerror = () => setImportError('Could not read that file.');
    reader.readAsText(file);
  };

  const confirmImport = () => {
    setTasks(pendingImport.tasks);
    if (pendingImport.journal) setJournalEntries(pendingImport.journal);
    if (pendingImport.career) {
      setCareer(pendingImport.career);
      setCareerSel(null);
      setCareerOpenId(null);

    setPendingImport(null);
  };

  const cancelImport = () => setPendingImport(null);

  const clearAll = () => {
    setTasks([]);
    setConfirmClear(false);
  };

  const visibleTasks = useMemo(() => {
    if (!filterCategory) return tasks;
    return tasks.filter((t) => t.category === filterCategory);
  }, [tasks, filterCategory]);

  const activeTasks = visibleTasks.filter((t) => !t.completed);
  const completedTasks = visibleTasks.filter((t) => t.completed);

  const callList = useMemo(
    () => tasks.filter((t) => !t.completed && t.phone && t.phone.trim()),
    [tasks]
  );
  const mailList = useMemo(
    () => tasks.filter((t) => !t.completed && t.email && t.email.trim()),
    [tasks]
  );

  const naturalSort = (list) => {
    const fresh = list.filter((t) => !isSnoozedToday(t)).sort((a, b) => score(b) - score(a));
    const snoozed = list
      .filter((t) => isSnoozedToday(t))
      .sort((a, b) => b.pushCount - a.pushCount || score(b) - score(a));
    return [...fresh, ...snoozed];
  };

  const naturalByCategory = useMemo(() => {
    const map = {};
    CATEGORIES.forEach((c) => {
      map[c.key] = [];
    });
    activeTasks.forEach((t) => {
      const key = t.category || 'work';
      if (map[key]) map[key].push(t);
    });
    Object.keys(map).forEach((k) => {
      map[k] = naturalSort(map[k]);
    });
    return map;
  }, [activeTasks]);

  const byCategory = useMemo(() => {
    const map = {};
    Object.keys(naturalByCategory).forEach((k) => {
      map[k] = mergeManualOrder(taskOrder[k], naturalByCategory[k]);
    });
    return map;
  }, [naturalByCategory, taskOrder]);

  const naturalAllTasksList = useMemo(() => CATEGORIES.flatMap((c) => naturalByCategory[c.key]), [naturalByCategory]);

  const allTasksList = useMemo(
    () => mergeManualOrder(taskOrderList, naturalAllTasksList),
    [taskOrderList, naturalAllTasksList]
  );

  const orderedCategories = columnOrder
    .map((key) => CATEGORIES.find((c) => c.key === key))
    .filter(Boolean)
    .concat(CATEGORIES.filter((c) => !columnOrder.includes(c.key)));

  const journalByNewest = [...journalEntries].sort((a, b) => b.createdAt - a.createdAt);

  const renderColumn = (col, isDraggable) => {

    const collapsed = !!collapsedCols[col.key];

    return (

        data-card={col.key}
        className="board-col rounded-md p-4"

          border: `1px solid ${COLORS.inkPanelBorder}`,
          borderTop: `3px solid ${col.accent}`,

            {isDraggable && (

            <button

              <span className="w-2.5 h-2.5 rounded-full" style={{ background: col.accent }} />
            </button>
          </div>
          <span className="font-mono text-xs" style={{ color: COLORS.textMuted }}>
            {list.length}

        </div>
        {!collapsed && (

        <div className="flex items-center gap-4 flex-wrap mb-5">

                <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: COLORS.textMuted }}>

              <div className="space-y-3" ref={listSortRef}>

                      </button>

                  </div>
                ))}

        )}

        {/* Journal */}
        {journalByNewest.length > 0 && (
          <div className="mt-8">
            <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: COLORS.textMuted }}>

                  onDelete={() => deleteJournalEntry(entry.id)}
                />
              ))}
            </div>
          </div>
        )}
        </>
        )}
      </div>
    </div>
  );

/* ---------- career pane ---------- */
const WHEEL = { C: 140, R: 138, r: 74, gap: 6 };

function polar(rad, deg) {
  const a = (deg * Math.PI) / 180;
  return [WHEEL.C + rad * Math.cos(a), WHEEL.C + rad * Math.sin(a)];
}

// Annular sector with a constant-width gap between neighbors.
function careerSector(a0, a1) {
  const { R, r, gap } = WHEEL;
  const oOff = ((gap / 2) / R) * (180 / Math.PI);
  const iOff = ((gap / 2) / r) * (180 / Math.PI);
  const [x1, y1] = polar(R, a0 + oOff);
  const [x2, y2] = polar(R, a1 - oOff);
  const [x3, y3] = polar(r, a1 - iOff);
  const [x4, y4] = polar(r, a0 + iOff);
  return `M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 0 0 ${x4} ${y4} Z`;
}

function CareerWheel({ career, lit, sel, onToggle, onAdd }) {
  const [draft, setDraft] = useState('');
  const inputRef = useRef(null);
  const litType = CAREER_TYPES.find((t) => t.key === lit);
  const selName = sel ? (career.companies.find((c) => c.id === sel) || {}).name : null;

  useEffect(() => {
    if (lit && inputRef.current) inputRef.current.focus();
  }, [lit]);

  const count = (key) =>
    sel && LINKABLE.includes(key) ? career[key].filter((x) => x.company === sel).length : career[key].length;

  const submit = () => {
    const v = draft.trim();
    if (!v || !lit) return;
    onAdd(lit, v);
    setDraft('');
  };

  return (
    <div className="relative shrink-0" style={{ width: 280, height: 280 }}>
      <svg viewBox="0 0 280 280" width="280" height="280" style={{ position: 'absolute', inset: 0, overflow: 'visible' }}>
        <defs>
          <filter id="career-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="7" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        {CAREER_TYPES.map((t) => {
          const isLit = lit === t.key;
          const linked = !!sel && !isLit && LINKABLE.includes(t.key);
          const [lx, ly] = polar((WHEEL.R + WHEEL.r) / 2, (t.a0 + t.a1) / 2);
          const textOpacity = isLit || linked ? 1 : 0.75;
          return (
            <g
              key={t.key}
              className={`career-wedge${isLit ? '' : ' dim'}`}
              onClick={() => onToggle(t.key)}
              filter={isLit ? 'url(#career-glow)' : undefined}
              role="button"
              aria-label={t.label}
              aria-pressed={isLit}
              style={{ cursor: 'pointer' }}
            >
              <path d={careerSector(t.a0, t.a1)} fill={t.color} style={{ opacity: isLit ? 1 : linked ? 0.62 : 0.3 }} />
              <text x={lx} y={ly - 2} textAnchor="middle" className="font-mono" fontSize="18" fontWeight="600" fill="#FAF7F0" style={{ pointerEvents: 'none', opacity: textOpacity }}>
                {count(t.key)}
              </text>
              <text x={lx} y={ly + 14} textAnchor="middle" fontSize="10" fontWeight="600" letterSpacing="1.2" fill="#FAF7F0" style={{ pointerEvents: 'none', opacity: textOpacity }}>
                {t.label.toUpperCase()}
              </text>
            </g>
          );
        })}
      </svg>
      <div
        className="absolute rounded-full flex flex-col items-center justify-center gap-1.5"
        style={{
          left: '50%', top: '50%', width: 132, height: 132, marginLeft: -66, marginTop: -66, padding: 14,
          background: COLORS.inkPanel,
          border: `1px solid ${litType ? litType.color : COLORS.inkPanelBorder}`,
        }}
      >
        <span className="text-[10px] font-semibold uppercase" style={{ letterSpacing: '0.1em', color: litType ? litType.color : COLORS.textMuted }}>
          {litType ? `New ${litType.one}` : 'Career'}
        </span>
        {litType && (
          <input
            ref={inputRef}
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            onKeyDown={(e) => e.key === 'Enter' && submit()}
            aria-label={`New ${litType.one}`}
            placeholder={litType.placeholder}
            className="w-full text-xs px-2 py-1.5 rounded-md border text-center"
            style={{ background: COLORS.ink, color: COLORS.textOnDark, borderColor: COLORS.inkPanelBorder }}
          />
        )}
        {litType && selName && LINKABLE.includes(lit) && (
          <span className="text-[10px] truncate" style={{ color: COLORS.textMuted, maxWidth: '100%' }}>
            @ {selName}
          </span>
        )}
      </div>
    </div>
  );
}

function CareerPane({ career, lit, sel, setSel, openId, setOpenId, onUpdate, onDelete, onClose }) {
  const type = CAREER_TYPES.find((t) => t.key === lit);
  const companyName = (id) => (career.companies.find((c) => c.id === id) || {}).name || '';
  const scoped = !!sel && LINKABLE.includes(lit);
  const items = scoped ? career[lit].filter((x) => x.company === sel) : career[lit];
  const inputStyle = { background: COLORS.ink, color: COLORS.textOnDark, borderColor: COLORS.inkPanelBorder, fontFamily: 'inherit' };

  const onRowClick = (x) => {
    if (lit === 'companies') setSel(sel === x.id && openId === x.id ? null : x.id);
    setOpenId(openId === x.id ? null : x.id);
  };

  return (
    <div className="mb-8">
      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <button
          onClick={onClose}
          title="Back to the board (Esc)"
          className="text-xs px-3 py-1.5 rounded-md border font-medium"
          style={{ borderColor: COLORS.inkPanelBorder, color: COLORS.textOnDark }}
        >
          ← Board
        </button>
        <span className="w-3 h-3 rounded-full" style={{ background: type.color }} />
        <h2 className="font-display text-2xl font-semibold" style={{ color: COLORS.textOnDark }}>
          {type.label}
        </h2>
        {scoped && (
          <button
            onClick={() => setSel(null)}
            className="text-xs px-2.5 py-1 rounded-full border"
            style={{ borderColor: COLORS.inkPanelBorder, color: COLORS.textOnDark }}
          >
            @ {companyName(sel)} ×
          </button>
        )}
        {sel && lit === 'companies' && (
          <button
            onClick={() => setSel(null)}
            className="text-xs px-2.5 py-1 rounded-full border"
            style={{ borderColor: COLORS.inkPanelBorder, color: COLORS.textMuted }}
          >
            Clear selection
          </button>
        )}
        <span className="font-mono text-xs ml-auto" style={{ color: COLORS.textMuted }}>
          {items.length}
        </span>
      </div>

      {items.length === 0 ? (
        <p className="text-sm italic py-4" style={{ color: COLORS.textMuted }}>Nothing here yet.</p>
      ) : (
        <div className="flex flex-col gap-2">
          {items.map((x) => {
            const isOpen = openId === x.id;
            const isSel = lit === 'companies' && sel === x.id;
            const nRoles = lit === 'companies' ? career.roles.filter((r) => r.company === x.id).length : 0;
            const nContacts = lit === 'companies' ? career.contacts.filter((c) => c.company === x.id).length : 0;
            let meta = '';
            if (lit === 'companies') meta = x.why;
            if (LINKABLE.includes(lit)) meta = x.company ? companyName(x.company) : 'no company';
            if (lit === 'contacts' && x.how) meta += ` · ${x.how}`;
            return (
              <div
                key={x.id}
                className="career-item rounded-md px-4 py-3 cursor-pointer"
                onClick={() => onRowClick(x)}
                style={{
                  background: COLORS.inkPanel,
                  borderStyle: 'solid',
                  borderColor: `${isSel ? type.color : COLORS.inkPanelBorder} ${isSel ? type.color : COLORS.inkPanelBorder} ${isSel ? type.color : COLORS.inkPanelBorder} ${type.color}`,
                  borderWidth: '1px 1px 1px 4px',
                  boxShadow: isSel ? `inset 0 0 0 1px ${type.color}` : undefined,
                }}
              >
                <div className="flex items-baseline gap-3">
                  <span className="text-[15px] font-semibold flex-1 min-w-0" style={{ color: COLORS.textOnDark }}>
                    {x.name}
                  </span>
                  {meta && (
                    <span className="text-xs truncate" style={{ color: COLORS.textMuted, maxWidth: '50%' }}>
                      {meta}
                    </span>
                  )}
                  <button
                    onClick={(e) => { e.stopPropagation(); onDelete(lit, x.id); }}
                    aria-label={`Delete ${type.one}`}
                    title="Delete"
                    className="shrink-0 self-center opacity-70 hover:opacity-100"
                    style={{ color: COLORS.textMuted }}
                  >
                    <XIcon size={14} />
                  </button>
                </div>
                {(nRoles > 0 || nContacts > 0) && (
                  <div className="flex gap-1.5 mt-1.5">
                    {nRoles > 0 && (
                      <span className="text-[11px] px-2 py-0.5 rounded-full" style={{ background: COLORS.amber, color: COLORS.paper }}>
                        {nRoles} role{nRoles === 1 ? '' : 's'}
                      </span>
                    )}
                    {nContacts > 0 && (
                      <span className="text-[11px] px-2 py-0.5 rounded-full" style={{ background: COLORS.moss, color: COLORS.paper }}>
                        {nContacts} contact{nContacts === 1 ? '' : 's'}
                      </span>
                    )}
                  </div>
                )}
                {isOpen && (
                  <div
                    onClick={(e) => e.stopPropagation()}
                    className="grid grid-cols-1 sm:grid-cols-[150px_1fr] gap-x-3 gap-y-2 mt-3 pt-3 cursor-default"
                    style={{ borderTop: `1px solid ${COLORS.inkPanelBorder}` }}
                  >
                    <label className="text-xs pt-1.5" style={{ color: COLORS.textMuted }}>{type.nameLabel}</label>
                    <input
                      value={x.name}
                      onChange={(e) => onUpdate(lit, x.id, { name: e.target.value })}
                      className="text-sm px-2 py-1.5 rounded-md border"
                      style={inputStyle}
                    />
                    {LINKABLE.includes(lit) && (
                      <>
                        <label className="text-xs pt-1.5" style={{ color: COLORS.textMuted }}>Company</label>
                        <select
                          value={x.company || ''}
                          onChange={(e) => onUpdate(lit, x.id, { company: e.target.value || null })}
                          className="text-sm px-2 py-1.5 rounded-md border"
                          style={inputStyle}
                        >
                          <option value="">—</option>
                          {career.companies.map((c) => (
                            <option key={c.id} value={c.id}>{c.name}</option>
                          ))}
                        </select>
                      </>
                    )}
                    {CAREER_FIELDS[lit].map(([f, label, area]) => (
                      <React.Fragment key={f}>
                        <label className="text-xs pt-1.5" style={{ color: COLORS.textMuted }}>{label}</label>
                        {area ? (
                          <textarea
                            value={x[f]}
                            onChange={(e) => onUpdate(lit, x.id, { [f]: e.target.value })}
                            rows={3}
                            className="text-sm px-2 py-1.5 rounded-md border"
                            style={{ ...inputStyle, resize: 'vertical' }}
                          />
                        ) : (
                          <input
                            value={x[f]}
                            onChange={(e) => onUpdate(lit, x.id, { [f]: e.target.value })}
                            className="text-sm px-2 py-1.5 rounded-md border"
                            style={inputStyle}
                          />
                        )}
                      </React.Fragment>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PushBadge({ count }) {
  const intense = count >= 3;
  return (
    <span
      className="font-mono text-[11px] px-1.5 py-0.5 rounded-sm font-semibold"
      style={{
        background: intense ? '#B5473A' : '#B5473A22',
        color: intense ? '#FAF7F0' : '#B5473A',
      }}
    >
      pushed ×{count}
    </span>
  );
}

function ToggleChip({ active, onClick, color, label }) {
  return (
    <button
      onClick={onClick}
      className="text-xs px-2.5 py-1.5 rounded-md border font-medium"
      style={active ? { background: color, borderColor: color, color: '#14181B' } : { borderColor: '#2C3336', color: '#93999B' }}
    >
      {label}
    </button>
  );
}

function ContactListPanel({ title, Icon, items, field, hrefPrefix }) {
  return (
    <div className="rounded-md p-3" style={{ background: COLORS.paperDim, border: '1px solid #E3DCC9' }}>
      <div className="flex items-center gap-1.5 mb-2" style={{ color: COLORS.textMutedOnPaper }}>
        <Icon size={13} />
        <span className="text-xs uppercase tracking-wide font-semibold">{title}</span>
        <span className="font-mono text-[11px] ml-auto">{items.length}</span>
      </div>
      {items.length === 0 ? (
        <p className="text-xs italic" style={{ color: COLORS.textMutedOnPaper }}>Nothing here right now.</p>
      ) : (
        <ul className="space-y-1.5">
          {items.map((t) => (
            <li key={t.id} className="text-xs flex items-center justify-between gap-2">
              <span className="truncate" style={{ color: COLORS.textInk }} title={t.title}>
                {t.title}
              </span>
              <a
                href={`${hrefPrefix}${field === 'phone' ? t.phone.replace(/[^0-9+]/g, '') : t.email}`}
                className="underline shrink-0"
                style={{ color: COLORS.textMutedOnPaper }}
              >
                {t[field]}
              </a>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function EditForm({ draft, setDraft, onSave, onCancel, ink }) {
  return (
    <div className="space-y-2">
      <input
        autoFocus
        value={draft.title}
        onChange={(e) => setDraft((d) => ({ ...d, title: e.target.value }))}
        onKeyDown={(e) => e.key === 'Enter' && onSave()}
        className="w-full text-sm px-2 py-1.5 rounded-md border"
        style={{ background: '#F0ECE1', color: '#211F1A', borderColor: '#E3DCC9' }}
      />
      <div className="flex items-center gap-2 flex-wrap">
        {CATEGORIES.map((c) => {
          const active = draft.category === c.key;
          return (
            <button
              key={c.key}
              onClick={() => setDraft((d) => ({ ...d, category: c.key }))}
              className="text-xs px-2 py-1 rounded-md border font-medium"
              style={active ? { background: c.color, borderColor: c.color, color: c.text } : { borderColor: ink ? `${ink}55` : '#E3DCC9', color: ink || '#7A756A' }}
            >
              {c.label}
            </button>
          );
        })}
      </div>
      <div className="flex items-center gap-2">
        <Clock size={13} />
        <input
          type="date"
          value={draft.scheduledDate || ''}
          onChange={(e) => setDraft((d) => ({ ...d, scheduledDate: e.target.value || null }))}
          aria-label="Scheduled date"
          className="flex-1 text-xs px-2 py-1.5 rounded-md border"
          style={{ background: '#F0ECE1', color: '#211F1A', borderColor: '#E3DCC9' }}
        />
      </div>
      <div className="flex items-center gap-2">
        <PhoneIcon size={13} />
        <input
          value={draft.phone}
          onChange={(e) => setDraft((d) => ({ ...d, phone: e.target.value }))}
          aria-label="Phone number"
          placeholder="Phone number"
          className="flex-1 text-xs px-2 py-1.5 rounded-md border"
          style={{ background: '#F0ECE1', color: '#211F1A', borderColor: '#E3DCC9' }}
        />
      </div>
      <div className="flex items-center gap-2">
        <MailIcon size={13} />
        <input
          value={draft.email}
          onChange={(e) => setDraft((d) => ({ ...d, email: e.target.value }))}
          aria-label="Email address"
          placeholder="Email address"
          className="flex-1 text-xs px-2 py-1.5 rounded-md border"
          style={{ background: '#F0ECE1', color: '#211F1A', borderColor: '#E3DCC9' }}
        />
      </div>
      <div className="flex items-center gap-2 pt-1">
        <button onClick={onSave} className="text-xs px-3 py-1 rounded-md font-medium" style={{ background: '#5C7A5E', color: '#FAF7F0' }}>
          Save
        </button>
        <button onClick={onCancel} className="text-xs px-3 py-1 rounded-md" style={{ color: ink || '#7A756A' }}>
          Cancel
        </button>
      </div>
    </div>
  );
}

function TaskCard({ task, snoozed, isEditing, editDraft, setEditDraft, onEditStart, onEditSave, onEditCancel, onComplete, onPush, onDelete }) {
  const category = categoryOf(task.category);
  const cardBg = category.accent;
  const cardText = textColorForHex(cardBg);

  if (isEditing) {
    const editCategory = categoryOf(editDraft.category);
    const editBg = editCategory.accent;
    const editText = textColorForHex(editBg);
    return (
      <div
        data-task-id={task.id}
        className="task-card rounded-md p-3.5 shadow-md relative"
        style={{ background: editBg, color: editText }}
      >
        <EditForm draft={editDraft} setDraft={setEditDraft} onSave={onEditSave} onCancel={onEditCancel} ink={editText} />
      </div>
    );
  }

  return (
    <div
      data-task-id={task.id}
      className="task-card rounded-md p-3.5 shadow-md relative"
      style={{
        background: cardBg,
        color: cardText,
        opacity: snoozed ? 0.55 : 1,
      }}
    >
      <div className="flex items-start gap-2.5">
        <span
          className="task-drag-handle mt-0.5 shrink-0 opacity-60"
          title="Drag to reorder"
          aria-label="Drag to reorder"
          style={{ color: cardText, fontSize: 13, letterSpacing: 1, lineHeight: 1 }}
        >
          ⋮⋮
        </span>
        <input
          type="checkbox"
          checked={task.completed}
          onChange={onComplete}
          aria-label="Mark done"
          title="Mark done"
          className="mt-0.5 w-4 h-4 shrink-0"
          style={{ accentColor: cardText }}
        />
        <p onClick={onEditStart} className="text-sm font-medium leading-snug flex-1 cursor-pointer" style={{ color: cardText }}>
          {task.title}
        </p>
        <button onClick={onEditStart} aria-label="Edit task" title="Edit" className="shrink-0 opacity-80" style={{ color: cardText }}>
          <PencilIcon size={14} />
        </button>
        {!snoozed && (
          <button onClick={onPush} aria-label="Push to tomorrow" title="Not today — push to tomorrow" className="shrink-0 opacity-80" style={{ color: cardText }}>
            <Clock size={14} />
          </button>
        )}
        <button onClick={onDelete} aria-label="Delete task" title="Delete" className="shrink-0 opacity-80" style={{ color: cardText }}>
          <XIcon size={14} />
        </button>
      </div>
      <div className="flex items-center gap-2 mt-2 flex-wrap pl-6">
        <span
          className="w-2 h-2 rounded-full shrink-0"
          style={{ background: category.accent, boxShadow: `0 0 0 1px ${cardText === '#211F1A' ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.6)'}` }}
          title={`${category.label}`}
        />
        {task.phone && (
          <a
            href={`tel:${task.phone.replace(/[^0-9+]/g, '')}`}
            onClick={(e) => e.stopPropagation()}
            title={`Call ${task.phone}`}
            className="flex items-center gap-1 underline"
            style={{ color: cardText }}
          >
            <PhoneIcon size={12} /> {task.phone}
          </a>
        )}
        {task.email && (
          <a
            href={`mailto:${task.email}`}
            onClick={(e) => e.stopPropagation()}
            title={`Email ${task.email}`}
            className="flex items-center gap-1 underline"
            style={{ color: cardText }}
          >
            <MailIcon size={12} /> {task.email}
          </a>
        )}
        {task.pushCount > 0 && <PushBadge count={task.pushCount} />}
        {snoozed && (
          <span className="text-xs italic opacity-80" style={{ color: cardText }}>
            back tomorrow
          </span>
        )}
      </div>
    </div>
  );
}

function JournalEntryBox({ entry, onSave, onDelete }) {
  const [collapsed, setCollapsed] = useState(true);
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(entry.text);

  const dateLabel = new Date(entry.createdAt).toLocaleString(undefined, {
    weekday: 'short',
    month: 'short',
    day: 'numeric',
    hour: 'numeric',
    minute: '2-digit',
  });

  const startEdit = () => {
    setDraft(entry.text);
    setEditing(true);
    setCollapsed(false);
  };

  const save = () => {
    if (!draft.trim()) return;
    onSave(draft.trim());
    setEditing(false);
  };

  const cancel = () => {
    setDraft(entry.text);
    setEditing(false);
  };

  return (
    <div className="rounded-md px-3 py-2" style={{ background: COLORS.inkPanel, border: `1px solid ${COLORS.inkPanelBorder}` }}>
      <button
        onClick={() => setCollapsed((c) => !c)}
        className="flex items-center gap-2 text-xs w-full text-left"
        style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', color: COLORS.textMuted }}
      >
        {collapsed ? <ChevronDown size={12} /> : <ChevronUp size={12} />}
        <span className="font-mono shrink-0">{dateLabel}</span>
        {collapsed && (
          <span className="truncate opacity-70 flex-1 min-w-0 text-left">{entry.text}</span>
        )}
      </button>
      {!collapsed && (
        <div className="mt-2 pl-5">
          {editing ? (
            <div className="space-y-2">
              <textarea
                autoFocus
                value={draft}
                onChange={(e) => setDraft(e.target.value)}
                rows={4}
                className="w-full text-sm px-2 py-1.5 rounded-md border"
                style={{ background: COLORS.ink, color: COLORS.textOnDark, borderColor: COLORS.inkPanelBorder, fontFamily: 'inherit', resize: 'vertical' }}
              />
              <div className="flex items-center gap-2">
                <button onClick={save} className="text-xs px-3 py-1 rounded-md font-medium" style={{ background: COLORS.moss, color: COLORS.paper }}>
                  Save
                </button>
                <button onClick={cancel} className="text-xs px-3 py-1 rounded-md" style={{ color: COLORS.textMuted }}>
                  Cancel
                </button>
              </div>
            </div>
          ) : (
            <>
              <p className="text-sm whitespace-pre-wrap" style={{ color: COLORS.textOnDark }}>
                {entry.text}
              </p>
              <div className="flex items-center gap-3 mt-2">
                <button onClick={startEdit} className="flex items-center gap-1 text-xs opacity-70" style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', color: COLORS.textMuted }}>
                  <PencilIcon size={11} /> Edit
                </button>
                <button onClick={onDelete} className="flex items-center gap-1 text-xs opacity-70" style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', color: COLORS.textMuted }}>
                  <XIcon size={11} /> Delete
                </button>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Docket />);
</script>
</body>
</html>
