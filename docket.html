<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Docket</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
  html, body, #root { min-height: 100%; }
  body { margin: 0; background: #14181B; }
  .docket-root { font-family: 'IBM Plex Sans', ui-sans-serif, system-ui; }
  .font-display { font-family: 'Fraunces', ui-serif, serif; }
  .font-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .docket-root *:focus-visible { outline: 2px solid #D98E3F; outline-offset: 2px; }
  .task-card { transition: transform 150ms ease, box-shadow 150ms ease; }
  .task-card:hover { transform: translateY(-2px); }
  .drag-handle { cursor: grab; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .board-col.sortable-ghost { opacity: 0.35; }
  .board-col.sortable-chosen { box-shadow: 0 0 0 2px #D98E3F; }
  .task-drag-handle { cursor: grab; user-select: none; }
  .task-drag-handle:active { cursor: grabbing; }
  .task-card.sortable-ghost { opacity: 0.4; }
  .task-card.sortable-chosen { box-shadow: 0 0 0 2px #D98E3F; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- tiny inline icon set (no external icon library needed) ---------- */

         strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

}
const XIcon = ({ size }) => (
  <IconBase size={size}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></IconBase>

const Clock = ({ size }) => (

const Plus = ({ size }) => (

);
const ChevronDown = ({ size }) => <IconBase size={size}><polyline points="6 9 12 15 18 9" /></IconBase>;
const ChevronUp = ({ size }) => <IconBase size={size}><polyline points="18 15 12 9 6 15" /></IconBase>;
const Trash2 = ({ size }) => (

const PencilIcon = ({ size }) => (

    <path d="M12 20h9" />
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
  </IconBase>
);
const PhoneIcon = ({ size }) => (
  <IconBase size={size}>
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z" />
  </IconBase>
);
const MailIcon = ({ size }) => (
  <IconBase size={size}>
    <rect x="2" y="4" width="20" height="16" rx="2" />
    <path d="m22 6-10 7L2 6" />
  </IconBase>
);

/* ---------- data + logic ---------- */
const COLORS = {
  ink: '#14181B',
  inkPanel: '#1B2023',
  inkPanelBorder: '#2C3336',
  paper: '#FAF7F0',
  paperDim: '#F0ECE1',
  textInk: '#211F1A',
  textOnDark: '#EDE8DA',
  textMuted: '#93999B',
  textMutedOnPaper: '#7A756A',
  amber: '#D98E3F',
  rust: '#B5473A',
  moss: '#5C7A5E',
  stone: '#767169',
  call: '#4B7BA6',
  schedule: '#6B5FA6',
  jhu: '#2F6F9E',
  mstc: '#A6753D',
};

const AREAS = [
  { key: 'work', label: 'Work', color: '#2E294E', text: '#FAF7F0', accent: '#3F8C82' },
  { key: 'personal', label: 'Personal', color: '#F1E9DA', text: '#211F1A', accent: '#B75D8C' },
];

const COURSES = [
  { key: 'jhu', label: 'JHU', sub: 'JHU homework — its own silo, outside the priority board', accent: COLORS.jhu },
  { key: 'mstc', label: 'MSTC', sub: 'MSTC homework — its own silo, outside the priority board', accent: COLORS.mstc },
];

/* Board columns: Work and Personal (movable, order saved in localStorage)
   plus the two homework silos, JHU and MSTC, always fixed on the right and
   never reorderable. Columns are driven by category (area), not urgency —
   urgent/important is still tracked per task for sorting, it just no
   longer decides which column a task lands in. Every column can be
   collapsed independently. */

const DAY_MS = 1000 * 60 * 60 * 24;
const STORAGE_KEY = 'docket-tasks';

function agingBonus(createdAt) {
  const days = (Date.now() - createdAt) / DAY_MS;
  return Math.min(days * 0.15, 3);
}

const AREA_WEIGHT = 1.5;

function score(task) {
  return task.pushCount * 3 + agingBonus(task.createdAt) + (task.areas.length - 1) * AREA_WEIGHT;
}

function areaOf(key) {
  return AREAS.find((a) => a.key === key) || AREAS[0];
}

function hexLuminance(hex) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substring(0, 2), 16) / 255;
  const g = parseInt(c.substring(2, 4), 16) / 255;
  const b = parseInt(c.substring(4, 6), 16) / 255;
  return 0.299 * r + 0.587 * g + 0.114 * b;
}

function textColorForHex(hex) {
  return hexLuminance(hex) > 0.55 ? '#211F1A' : '#FAF7F0';
}

function loadTasks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveTasks(tasks) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch (e) {}
}

/* ---------- journal entries: separate from tasks entirely, their own
   storage key, their own shape (just text + a timestamp). ---------- */
const JOURNAL_STORAGE_KEY = 'docket-journal';

function loadJournal() {
  try {
    const raw = localStorage.getItem(JOURNAL_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveJournal(entries) {
  try {
    localStorage.setItem(JOURNAL_STORAGE_KEY, JSON.stringify(entries));
  } catch (e) {}
}

function normalizeJournalEntry(e, idx) {
  return {
    id: e.id || `${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 6)}`,
    text: String(e.text || ''),
    createdAt: Number(e.createdAt) || Date.now(),
  };
}

const BOARD_UI_KEY = 'docket-board-ui';

function loadBoardUI() {
  try {
    const raw = localStorage.getItem(BOARD_UI_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {};
}

function saveBoardUI(ui) {
  try {
    localStorage.setItem(BOARD_UI_KEY, JSON.stringify(ui));
  } catch (e) {}
}

/* ---------- task drag-to-reorder (same idea as the column drag-handle above,
   and ported from Runway's ledger row dragging) ---------- */
const TASK_ORDER_KEY = 'docket-task-order';
const TASK_ORDER_LIST_KEY = 'docket-task-order-list';
const TASK_ORDER_HOMEWORK_LIST_KEY = 'docket-task-order-homework-list';

function loadOrderMap(key) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveOrderMap(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

// Tasks are otherwise auto-sorted by score(), which drifts over time (aging, pushes).
// Dragging a task records an explicit position; anything not yet touched by a drag
// keeps falling back to its natural score-sorted rank, slotted in right next to
// wherever its nearest natural neighbor already landed.
function mergeManualOrder(persistedIds, naturalOrderTasks) {
  const byId = {};
  const rankById = {};
  naturalOrderTasks.forEach((t, idx) => {
    byId[t.id] = t;
    rankById[t.id] = idx;
  });
  const ordered = (persistedIds || []).filter((id) => byId[id]);
  const placed = new Set(ordered);
  naturalOrderTasks.forEach((t) => {
    if (placed.has(t.id)) return;
    let precedingId = null;
    for (let i = rankById[t.id] - 1; i >= 0; i--) {
      const candidateId = naturalOrderTasks[i].id;
      if (placed.has(candidateId)) {
        precedingId = candidateId;
        break;
      }
    }
    const insertAt = precedingId ? ordered.indexOf(precedingId) + 1 : 0;
    ordered.splice(insertAt, 0, t.id);
    placed.add(t.id);
  });
  return ordered.map((id) => byId[id]);
}

function normalizeTask(t, idx) {
  let areas = Array.isArray(t.areas) ? t.areas.filter((k) => AREAS.some((a) => a.key === k)) : [];
  if (areas.length === 0 && t.area && AREAS.some((a) => a.key === t.area)) areas = [t.area];
  if (areas.length === 0) areas = ['work'];
  return {
    id: t.id || `${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 6)}`,
    title: String(t.title || 'Untitled'),
    areas,
    urgent: t.urgent === true || t.urgent === false ? t.urgent : null,
    important: t.important === true || t.important === false ? t.important : null,
    phone: t.phone || (t.contactMethod === 'phone' ? t.contactValue : '') || (t.isCall ? t.callContact : '') || '',
    email: t.email || (t.contactMethod === 'email' ? t.contactValue : '') || '',
    course: COURSES.some((c) => c.key === t.course) ? t.course : null,
    pushCount: Number(t.pushCount) || 0,
    completed: !!t.completed,
    createdAt: Number(t.createdAt) || Date.now(),
    snoozedDay: t.snoozedDay || null,
  };
}

/* ---------- app ---------- */
function Docket() {
  const [tasks, setTasks] = useState([]);
  const [journalEntries, setJournalEntries] = useState([]);
  const [journalMode, setJournalMode] = useState(false);
  const [journalDraft, setJournalDraft] = useState('');
  const [loaded, setLoaded] = useState(false);
  const [today] = useState(() => new Date().toDateString());
  const [filterAreas, setFilterAreas] = useState(new Set());
  const [viewMode, setViewMode] = useState('columns');
  const [showDone, setShowDone] = useState(false);
  const [showFormDetails, setShowFormDetails] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);
  const [pendingImport, setPendingImport] = useState(null);
  const [importError, setImportError] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const fileInputRef = useRef(null);
  const columnSortRef = useRef(null);
  const taskListRefs = useRef({});
  const listSortRef = useRef(null);
  const [form, setForm] = useState({ title: '', areas: ['work'], urgent: null, important: null, phone: '', email: '', course: null });
  const [columnOrder, setColumnOrder] = useState(() => {
    const saved = loadBoardUI().order;
    return Array.isArray(saved) && saved.length ? saved : AREAS.map((a) => a.key);
  });
  const [collapsedCols, setCollapsedCols] = useState(() => loadBoardUI().collapsed || {});
  // Manual drag order for tasks: per-column (Columns view), one flat list for the
  // main tasks (List view), and one for the combined homework list (List view).
  const [taskOrder, setTaskOrder] = useState({});
  const [taskOrderList, setTaskOrderList] = useState([]);
  const [taskOrderHomeworkList, setTaskOrderHomeworkList] = useState([]);
  const homeworkListSortRef = useRef(null);

  useEffect(() => {
    const stored = loadTasks();
    setTasks((stored || []).map((t, i) => normalizeTask(t, i)));
    const storedJournal = loadJournal();
    setJournalEntries((storedJournal || []).map((e, i) => normalizeJournalEntry(e, i)));
    const storedOrder = loadOrderMap(TASK_ORDER_KEY);
    if (storedOrder) setTaskOrder(storedOrder);
    const storedOrderList = loadOrderMap(TASK_ORDER_LIST_KEY);
    if (Array.isArray(storedOrderList)) setTaskOrderList(storedOrderList);
    const storedOrderHomeworkList = loadOrderMap(TASK_ORDER_HOMEWORK_LIST_KEY);
    if (Array.isArray(storedOrderHomeworkList)) setTaskOrderHomeworkList(storedOrderHomeworkList);
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    saveTasks(tasks);
  }, [tasks, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveJournal(journalEntries);
  }, [journalEntries, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveOrderMap(TASK_ORDER_KEY, taskOrder);
  }, [taskOrder, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveOrderMap(TASK_ORDER_LIST_KEY, taskOrderList);
  }, [taskOrderList, loaded]);

  useEffect(() => {
    if (!loaded) return;
    saveOrderMap(TASK_ORDER_HOMEWORK_LIST_KEY, taskOrderHomeworkList);
  }, [taskOrderHomeworkList, loaded]);

  useEffect(() => {
    saveBoardUI({ order: columnOrder, collapsed: collapsedCols });
  }, [columnOrder, collapsedCols]);

  useEffect(() => {
    if (viewMode !== 'columns' || typeof Sortable === 'undefined' || !columnSortRef.current) return;
    const sortable = Sortable.create(columnSortRef.current, {
      handle: '.drag-handle',
      animation: 150,
      onEnd: () => {
        const ids = [...columnSortRef.current.querySelectorAll('[data-card]')].map((el) => el.getAttribute('data-card'));
        setColumnOrder(ids);
      },
    });
    return () => sortable.destroy();
  }, [viewMode]);

  // One Sortable instance per column's task list, so tasks can be dragged up/down
  // within their column. Re-created when columns collapse/expand (their list
  // container mounts/unmounts) or when switching in and out of Columns view.
  useEffect(() => {
    if (viewMode !== 'columns' || typeof Sortable === 'undefined') return;
    const keys = [...AREAS.map((a) => a.key), ...COURSES.map((c) => c.key)];
    const instances = keys
      .map((key) => {
        const el = taskListRefs.current[key];
        if (!el) return null;
        return Sortable.create(el, {
          handle: '.task-drag-handle',
          animation: 150,
          onEnd: () => {
            const ids = [...el.querySelectorAll('[data-task-id]')].map((n) => n.getAttribute('data-task-id'));
            setTaskOrder((prev) => ({ ...prev, [key]: ids }));
          },
        });
      })
      .filter(Boolean);
    return () => instances.forEach((inst) => inst.destroy());
  }, [viewMode, collapsedCols]);

  // Same idea for List view, which splits into two columns: the main task list
  // and a combined homework list (JHU + MSTC) — each with its own flat, independent order.
  useEffect(() => {
    if (viewMode !== 'list' || typeof Sortable === 'undefined') return;
    const instances = [];
    if (listSortRef.current) {
      const el = listSortRef.current;
      instances.push(
        Sortable.create(el, {
          handle: '.task-drag-handle',
          animation: 150,
          onEnd: () => {
            const ids = [...el.querySelectorAll('[data-task-id]')].map((n) => n.getAttribute('data-task-id'));
            setTaskOrderList(ids);
          },
        })
      );
    }
    if (homeworkListSortRef.current) {
      const el = homeworkListSortRef.current;
      instances.push(
        Sortable.create(el, {
          handle: '.task-drag-handle',
          animation: 150,
          onEnd: () => {
            const ids = [...el.querySelectorAll('[data-task-id]')].map((n) => n.getAttribute('data-task-id'));
            setTaskOrderHomeworkList(ids);
          },
        })
      );
    }
    return () => instances.forEach((inst) => inst.destroy());
  }, [viewMode]);

  const toggleColumnCollapse = (key) => setCollapsedCols((prev) => ({ ...prev, [key]: !prev[key] }));

  const isSnoozedToday = (task) => task.snoozedDay === today;

  const addTask = () => {
    if (!form.title.trim()) return;
    const t = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      title: form.title.trim(),
      areas: form.areas,
      urgent: form.urgent,
      important: form.important,
      phone: form.phone.trim(),
      email: form.email.trim(),
      course: form.course,
      pushCount: 0,
      completed: false,
      createdAt: Date.now(),
      snoozedDay: null,
    };
    setTasks((prev) => [...prev, t]);
    setForm({ title: '', areas: ['work'], urgent: null, important: null, phone: '', email: '', course: null });
  };

  const addJournalEntry = () => {
    if (!journalDraft.trim()) return;
    const entry = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      text: journalDraft.trim(),
      createdAt: Date.now(),
    };
    setJournalEntries((prev) => [...prev, entry]);
    setJournalDraft('');
  };

  const updateJournalEntry = (id, text) =>
    setJournalEntries((prev) => prev.map((e) => (e.id === id ? { ...e, text } : e)));

  const deleteJournalEntry = (id) => setJournalEntries((prev) => prev.filter((e) => e.id !== id));

  const toggleFormArea = (key) =>
    setForm((f) => {
      const has = f.areas.includes(key);
      if (has && f.areas.length === 1) return f;
      return { ...f, areas: has ? f.areas.filter((k) => k !== key) : [...f.areas, key] };
    });

  const toggleComplete = (id) =>
    setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t)));

  const deleteTask = (id) => setTasks((prev) => prev.filter((t) => t.id !== id));

  const pushTask = (id) =>
    setTasks((prev) =>
      prev.map((t) => (t.id === id ? { ...t, pushCount: t.pushCount + 1, snoozedDay: today } : t))
    );

  const startEdit = (task) => {
    setEditingId(task.id);
    setEditDraft({
      title: task.title,
      areas: [...task.areas],
      urgent: task.urgent,
      important: task.important,
      phone: task.phone || '',
      email: task.email || '',
      course: task.course || null,
    });
  };

  const cancelEdit = () => {
    setEditingId(null);
    setEditDraft(null);
  };

  const saveEdit = () => {
    if (!editDraft || !editDraft.title.trim()) return;
    setTasks((prev) =>
      prev.map((t) =>
        t.id === editingId
          ? {
              ...t,
              title: editDraft.title.trim(),
              areas: editDraft.areas,
              urgent: editDraft.urgent,
              important: editDraft.important,
              phone: editDraft.phone.trim(),
              email: editDraft.email.trim(),
              course: editDraft.course || null,
            }
          : t
      )
    );
    setEditingId(null);
    setEditDraft(null);
  };

  const toggleAreaFilter = (key) =>
    setFilterAreas((prev) => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `docket-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const triggerImport = () => {
    setImportError(null);
    fileInputRef.current && fileInputRef.current.click();
  };

  const handleFileSelected = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error('not an array');
        setPendingImport(parsed.map((t, idx) => normalizeTask(t, idx)));
        setImportError(null);
      } catch (err) {
        setImportError("That file doesn't look like a Docket backup.");
      }
    };
    reader.onerror = () => setImportError('Could not read that file.');
    reader.readAsText(file);
  };

  const confirmImport = () => {
    setTasks(pendingImport);
    setPendingImport(null);
  };

  const cancelImport = () => setPendingImport(null);

  const clearAll = () => {
    setTasks([]);
    setConfirmClear(false);
  };

  const visibleTasks = useMemo(() => {
    if (filterAreas.size === 0) return tasks;
    return tasks.filter((t) => t.areas.some((k) => filterAreas.has(k)));
  }, [tasks, filterAreas]);

  const activeTasks = visibleTasks.filter((t) => !t.completed);
  const completedTasks = visibleTasks.filter((t) => t.completed);

  // Aggregated across every task regardless of the area filter, so the call
  // list and mail list in the "add details" panel always show the full
  // backlog of who still needs to be reached.
  const callList = useMemo(
    () => tasks.filter((t) => !t.completed && t.phone && t.phone.trim()),
    [tasks]
  );
  const mailList = useMemo(
    () => tasks.filter((t) => !t.completed && t.email && t.email.trim()),
    [tasks]
  );

  const naturalSort = (list) => {
    const fresh = list.filter((t) => !isSnoozedToday(t)).sort((a, b) => score(b) - score(a));
    const snoozed = list
      .filter((t) => isSnoozedToday(t))
      .sort((a, b) => b.pushCount - a.pushCount || score(b) - score(a));
    return [...fresh, ...snoozed];
  };

  const naturalByArea = useMemo(() => {
    const map = {};
    AREAS.forEach((a) => {
      map[a.key] = [];
    });
    activeTasks
      .filter((t) => !t.course)
      .forEach((t) => {
        const key = AREAS.some((a) => a.key === t.areas[0]) ? t.areas[0] : AREAS[0].key;
        map[key].push(t);
      });
    Object.keys(map).forEach((k) => {
      map[k] = naturalSort(map[k]);
    });
    return map;
  }, [activeTasks, today]);

  const naturalByCourse = useMemo(() => {
    const map = { jhu: [], mstc: [] };
    activeTasks.filter((t) => t.course && map[t.course]).forEach((t) => map[t.course].push(t));
    Object.keys(map).forEach((k) => {
      map[k] = naturalSort(map[k]);
    });
    return map;
  }, [activeTasks, today]);

  const byArea = useMemo(() => {
    const map = {};
    Object.keys(naturalByArea).forEach((k) => {
      map[k] = mergeManualOrder(taskOrder[k], naturalByArea[k]);
    });
    return map;
  }, [naturalByArea, taskOrder]);

  const byCourse = useMemo(() => {
    const map = {};
    Object.keys(naturalByCourse).forEach((k) => {
      map[k] = mergeManualOrder(taskOrder[k], naturalByCourse[k]);
    });
    return map;
  }, [naturalByCourse, taskOrder]);

  const naturalAllTasksList = useMemo(() => AREAS.flatMap((a) => naturalByArea[a.key]), [naturalByArea]);

  const allTasksList = useMemo(
    () => mergeManualOrder(taskOrderList, naturalAllTasksList),
    [taskOrderList, naturalAllTasksList]
  );

  // List view's second column: JHU + MSTC combined into one homework list.
  const naturalHomeworkList = useMemo(
    () => COURSES.flatMap((c) => naturalByCourse[c.key]),
    [naturalByCourse]
  );

  const homeworkList = useMemo(
    () => mergeManualOrder(taskOrderHomeworkList, naturalHomeworkList),
    [taskOrderHomeworkList, naturalHomeworkList]
  );

  const orderedAreas = columnOrder
    .map((key) => AREAS.find((a) => a.key === key))
    .filter(Boolean)
    .concat(AREAS.filter((a) => !columnOrder.includes(a.key)));

  // Newest journal entry first — otherwise unsorted, unfiltered, unrelated to tasks.
  const journalByNewest = [...journalEntries].sort((a, b) => b.createdAt - a.createdAt);

  const renderColumn = (col, isDraggable) => {
    const list = col.kind === 'course' ? byCourse[col.key] : byArea[col.key];
    const collapsed = !!collapsedCols[col.key];
    return (
      <div
        key={col.key}
        data-card={col.key}
        className="board-col rounded-md p-4"
        style={{
          background: COLORS.inkPanel,
          border: `1px solid ${COLORS.inkPanelBorder}`,
          borderTop: `3px solid ${col.accent}`,
          borderLeft: col.key === 'jhu' ? `1px dashed ${COLORS.inkPanelBorder}` : undefined,
        }}
      >
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-1.5">
            {isDraggable && (
              <span className="drag-handle" title="Drag to reorder" style={{ color: COLORS.textMuted, fontSize: 13, letterSpacing: 1 }}>
                ⋮⋮
              </span>
            )}
            <button
              onClick={() => toggleColumnCollapse(col.key)}
              aria-label={collapsed ? `Expand ${col.label}` : `Collapse ${col.label}`}
              title={`${col.label} — ${col.sub}`}
              className="flex items-center gap-1.5"
              style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer' }}
            >
              <span style={{ color: COLORS.textMuted, fontSize: 10 }}>{collapsed ? '▸' : '▾'}</span>
              <span className="w-2.5 h-2.5 rounded-full" style={{ background: col.accent }} />
            </button>
          </div>
          <span className="font-mono text-xs" style={{ color: COLORS.textMuted }}>
            {list.length}
          </span>
        </div>
        {!collapsed && (
          <div className="space-y-3" ref={(el) => { taskListRefs.current[col.key] = el; }}>
            {list.map((t) => (
              <TaskCard
                key={t.id}
                task={t}
                snoozed={isSnoozedToday(t)}
                isEditing={editingId === t.id}
                editDraft={editDraft}
                setEditDraft={setEditDraft}
                onEditStart={() => startEdit(t)}
                onEditSave={saveEdit}
                onEditCancel={cancelEdit}
                onComplete={() => toggleComplete(t.id)}
                onPush={() => pushTask(t.id)}
                onDelete={() => deleteTask(t.id)}
              />
            ))}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ background: COLORS.ink, minHeight: '100%', color: COLORS.textOnDark }} className="w-full">
      <div className="docket-root w-full px-4 sm:px-6 py-8">
        {/* Header */}
        <div className="flex items-start justify-between mb-8 flex-wrap gap-3">
          <div>
            <h1 className="font-display text-3xl sm:text-4xl font-semibold tracking-tight" style={{ color: COLORS.textOnDark }}>
              Docket
            </h1>
            <p className="text-sm mt-1" style={{ color: COLORS.textMuted }}>
              {new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}
            </p>
          </div>
          <div className="flex items-center gap-2">
            <a
              href="runway.html"
              className="text-xs px-3 py-2 rounded-md border no-underline"
              style={{ borderColor: COLORS.inkPanelBorder, color: COLORS.textMuted }}
            >
              Runway
            </a>
            <button
              onClick={exportBackup}
              className="text-xs px-3 py-2 rounded-md border"
              style={{ borderColor: COLORS.inkPanelBorder, color: COLORS.textMuted }}
            >
              Export backup
            </button>
            <button
              onClick={triggerImport}
              className="text-xs px-3 py-2 rounded-md border"
              style={{ borderColor: COLORS.inkPanelBorder, color: COLORS.textMuted }}
            >
              Import backup
            </button>
            <button
              onClick={() => setConfirmClear(true)}
              className="text-xs px-3 py-2 rounded-md border"
              style={{ borderColor: COLORS.inkPanelBorder, color: COLORS.textMuted }}
            >
              Clear board
            </button>
            <input type="file" accept="application/json" ref={fileInputRef} onChange={handleFileSelected} style={{ display: 'none' }} />
          </div>
        </div>

        {pendingImport && (
          <div
            className="rounded-md p-4 mb-8 text-sm flex items-center justify-between gap-4 flex-wrap"
            style={{ background: COLORS.inkPanel, border: `1px solid ${COLORS.call}`, color: COLORS.textOnDark }}
          >
            <span>
              Replace your {tasks.length} current task{tasks.length === 1 ? '' : 's'} with {pendingImport.length} from
              the backup file?
            </span>
            <div className="flex items-center gap-2 shrink-0">
              <button onClick={confirmImport} className="text-xs px-3 py-1.5 rounded-md font-medium" style={{ background: COLORS.moss, color: COLORS.paper }}>
                Replace
              </button>
              <button onClick={cancelImport} className="text-xs px-3 py-1.5 rounded-md" style={{ color: COLORS.textMuted }}>
                Cancel
              </button>
            </div>
          </div>
        )}

        {importError && (
          <div
            className="rounded-md p-3 mb-8 text-sm flex items-center justify-between gap-4"
            style={{ background: COLORS.inkPanel, border: `1px solid ${COLORS.rust}`, color: COLORS.textOnDark }}
          >
            <span>{importError}</span>
            <button onClick={() => setImportError(null)} className="text-xs underline shrink-0" style={{ color: COLORS.textMuted }}>
              Dixsmiss
            </button>
          </div>
        )}

        {confirmClear && (
          <div
            className="rounded-md p-4 mb-8 text-sm flex items-center justify-between gap-4 flex-wrap"
            style={{ background: COLORS.inkPanel, border: `1px solid ${COLORS.rust}`, color: COLORS.textOnDark }}
          >
            <span>
              Clear all {tasks.length} task{tasks.length === 1 ? '' : 's'}? This can't be undone unless you've
              exported a backup.
            </span>
            <div className="flex items-center gap-2 shrink-0">
              <button onClick={clearAll} className="text-xs px-3 py-1.5 rounded-md font-medium" style={{ background: COLORS.rust, color: COLORS.paper }}>
                Clear everything
              </button>
              <button onClick={() => setConfirmClear(false)} className="text-xs px-3 py-1.5 rounded-md" style={{ color: COLORS.textMuted }}>
                Cancel
              </button>
            </div>
          </div>
        )}

        {/* Big input, with the call/mail lists permanently alongside it */}
        <div className="grid grid-cols-1 lg:grid-cols-[1fr_300px] gap-5 mb-8 items-start">
        <div
          className="rounded-md p-5 sm:p-6 shadow-md"
          style={{ background: COLORS.paper, color: COLORS.textInk }}
        >
          <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
            <label
              className="block text-xs uppercase tracking-wide font-semibold"
              style={{ color: COLORS.textMutedOnPaper }}
            >
              {journalMode ? 'Journal' : 'To Do'}
            </label>
            <label
              className="flex items-center gap-1.5 text-xs cursor-pointer select-none"
              style={{ color: COLORS.textMutedOnPaper }}
            >
              <input
                type="checkbox"
                checked={journalMode}
                onChange={(e) => setJournalMode(e.target.checked)}
                style={{ accentColor: COLORS.stone }}
              />
              du jour
            </label>
          </div>
          {journalMode ? (
            <>
              <textarea
                value={journalDraft}
                onChange={(e) => setJournalDraft(e.target.value)}
                aria-label="Journal entry"
                                rows={5}
                className="w-full text-base px-4 py-3 rounded-md mb-4 border"
                style={{ background: COLORS.paperDim, color: COLORS.textInk, borderColor: '#E3DCC9', fontFamily: 'inherit', resize: 'vertical' }}
              />
              <button
                onClick={addJournalEntry}
                disabled={!journalDraft.trim()}
                className="text-sm px-5 py-2.5 rounded-md font-semibold disabled:opacity-40 mt-1"
                style={{ background: COLORS.stone, color: COLORS.paper }}
              >
                Save entry
              </button>
            </>
          ) : (
            <>
              <input
                value={form.title}
                onChange={(e) => setForm((f) => ({ ...f, title: e.target.value }))}
                onKeyDown={(e) => e.key === 'Enter' && addTask()}
                aria-label="Task title"
                className="w-full font-display text-lg sm:text-xl px-4 py-3 rounded-md mb-4 border"
                style={{ background: COLORS.paperDim, color: COLORS.textInk, borderColor: '#E3DCC9' }}
              />
              <div className="mb-3">
                <PriorityGrid
                  urgent={form.urgent}
                  important={form.important}
                  onChange={(u, i) => setForm((f) => ({ ...f, urgent: u, important: i }))}
                />
              </div>
              <div className="mb-3 flex items-center gap-2 flex-wrap">
                {COURSES.map((c) => (
                  <ToggleChip
                    key={c.key}
                    active={form.course === c.key}
                    onClick={() => setForm((f) => ({ ...f, course: f.course === c.key ? null : c.key }))}
                    color={c.accent}
                    label={`${c.label} Homework`}
                  />
                ))}
              </div>
              <div className="mb-3">
                <button
                  onClick={() => setShowFormDetails((s) => !s)}
                  className="text-xs underline"
                  style={{ color: COLORS.textMutedOnPaper }}
                >
                  {showFormDetails ? 'Hide details' : '+ Add details (area, contact)'}
                </button>
              </div>
              {showFormDetails && (
                <div className="space-y-3 mb-3 pt-3" style={{ borderTop: '1px solid #E3DCC9' }}>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    {AREAS.map((a) => {
                      const active = form.areas.includes(a.key);
                      return (
                        <button
                          key={a.key}
                          onClick={() => toggleFormArea(a.key)}
                          className="text-xs px-2.5 py-1.5 rounded-md border font-medium"
                          style={
                            active
                              ? { background: a.color, borderColor: a.color, color: a.text }
                              : { borderColor: '#E3DCC9', color: COLORS.textMutedOnPaper }
                          }
                        >
                          {a.label}
                        </button>
                      );
                    })}
                  </div>
                  <div className="flex items-center gap-2">
                    <PhoneIcon size={14} />
                    <input
                      value={form.phone}
                      onChange={(e) => setForm((f) => ({ ...f, phone: e.target.value }))}
                      onKeyDown={(e) => e.key === 'Enter' && addTask()}
                      aria-label="Phone number"
                      placeholder="Phone number — adds this to the call list"
                      className="flex-1 text-sm px-3 py-2 rounded-md border"
                      style={{ background: COLORS.paperDim, color: COLORS.textInk, borderColor: '#E3DCC9' }}
                    />
                  </div>
                  <div className="flex items-center gap-2">
                    <MailIcon size={14} />
                    <input
                      value={form.email}
                      onChange={(e) => setForm((f) => ({ ...f, email: e.target.value }))}
                      onKeyDown={(e) => e.key === 'Enter' && addTask()}
                      aria-label="Email address"
                      placeholder="Email address — adds this to the mail list"
                      className="flex-1 text-sm px-3 py-2 rounded-md border"
                      style={{ background: COLORS.paperDim, color: COLORS.textInk, borderColor: '#E3DCC9' }}
                    />
                  </div>
                </div>
              )}
              <button
                onClick={addTask}
                disabled={!form.title.trim()}
                className="text-sm px-5 py-2.5 rounded-md font-semibold disabled:opacity-40 mt-1"
                style={{ background: COLORS.moss, color: COLORS.paper }}
              >
                Pin it
              </button>
            </>
          )}
        </div>

        <div className="flex flex-col gap-4">
          <ContactListPanel title="Call list" Icon={PhoneIcon} items={callList} field="phone" hrefPrefix="tel:" />
          <ContactListPanel title="Mail list" Icon={MailIcon} items={mailList} field="email" hrefPrefix="mailto:" />
        </div>
        </div>

        {/* Filters */}
        <div className="flex items-center justify-between gap-4 mb-3 flex-wrap">
          <div className="flex items-center gap-2 flex-wrap">
            {AREAS.map((a) => (
              <button
                key={a.key}
                onClick={() => toggleAreaFilter(a.key)}
                className="text-xs px-2.5 py-1 rounded-full border font-medium"
                style={
                  filterAreas.has(a.key)
                    ? { background: a.color, borderColor: a.color, color: a.text }
                    : { borderColor: COLORS.inkPanelBorder, color: COLORS.textMuted }
                }
              >
                {a.label}
              </button>
            ))}
            {filterAreas.size > 0 && (
              <button onClick={() => setFilterAreas(new Set())} className="text-xs underline" style={{ color: COLORS.textMuted }}>
                Clear filters
              </button>
            )}
          </div>
          <div className="flex items-center gap-1 rounded-md p-0.5" style={{ background: COLORS.inkPanel, border: `1px solid ${COLORS.inkPanelBorder}` }}>
            <button
              onClick={() => setViewMode('columns')}
              className="text-xs px-2.5 py-1 rounded font-medium"
              style={viewMode === 'columns' ? { background: COLORS.moss, color: COLORS.paper } : { color: COLORS.textMuted }}
            >
              Columns
            </button>
            <button
              onClick={() => setViewMode('list')}
              className="text-xs px-2.5 py-1 rounded font-medium"
              style={viewMode === 'list' ? { background: COLORS.moss, color: COLORS.paper } : { color: COLORS.textMuted }}
            >
              List
            </button>
          </div>
        </div>

        <div className="flex items-center gap-4 flex-wrap mb-5">
          {AREAS.map((a) => (
            <div key={a.key} className="flex items-center gap-1.5" title={`${a.label} column`}>
              <span className="w-2 h-2 rounded-full shrink-0" style={{ background: a.accent }} />
              <span className="text-xs" style={{ color: COLORS.textMuted }}>
                {a.label}
              </span>
            </div>
          ))}
          {COURSES.map((c) => (
            <div key={c.key} className="flex items-center gap-1.5" title={c.sub}>
              <span className="w-2 h-2 rounded-full shrink-0" style={{ background: c.accent }} />
              <span className="text-xs" style={{ color: COLORS.textMuted }}>
                {c.label}
              </span>
            </div>
          ))}
        </div>

        {/* Board: four columns in one row — Work and Personal (movable, by
            category, not urgency), then JHU and MSTC fixed on the right.
            Homework columns keep their spot regardless of what happens to
            Work/Personal next to them. */}
        {viewMode === 'columns' ? (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
            <div className="contents" ref={columnSortRef}>
              {orderedAreas.map((a) => renderColumn({ ...a, kind: 'area' }, true))}
            </div>
            {COURSES.map((c) => renderColumn({ ...c, kind: 'course' }, false))}
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-8">
            <div className="rounded-md p-4" style={{ background: COLORS.inkPanel, border: `1px solid ${COLORS.inkPanelBorder}` }}>
              <div className="flex items-center justify-between mb-3">
                <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: COLORS.textMuted }}>
                  Tasks
                </span>
                <span className="font-mono text-xs" style={{ color: COLORS.textMuted }}>
                  {allTasksList.length}
                </span>
              </div>
              <div className="space-y-3" ref={listSortRef}>
                {allTasksList.map((t) => (
                  <TaskCard
                    key={t.id}
                    task={t}
                    snoozed={isSnoozedToday(t)}
                    isEditing={editingId === t.id}
                    editDraft={editDraft}
                    setEditDraft={setEditDraft}
                    onEditStart={() => startEdit(t)}
                    onEditSave={saveEdit}
                    onEditCancel={cancelEdit}
                    onComplete={() => toggleComplete(t.id)}
                    onPush={() => pushTask(t.id)}
                    onDelete={() => deleteTask(t.id)}
                  />
                ))}
              </div>
            </div>
            <div
              className="rounded-md p-4"
              style={{ background: COLORS.inkPanel, border: `1px solid ${COLORS.inkPanelBorder}`, borderLeft: `1px dashed ${COLORS.inkPanelBorder}` }}
            >
              <div className="flex items-center justify-between mb-3">
                <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: COLORS.textMuted }}>
                  Homework
                </span>
                <span className="font-mono text-xs" style={{ color: COLORS.textMuted }}>
                  {homeworkList.length}
                </span>
              </div>
              <div className="space-y-3" ref={homeworkListSortRef}>
                {homeworkList.map((t) => (
                  <TaskCard
                    key={t.id}
                    task={t}
                    snoozed={isSnoozedToday(t)}
                    isEditing={editingId === t.id}
                    editDraft={editDraft}
                    setEditDraft={setEditDraft}
                    onEditStart={() => startEdit(t)}
                    onEditSave={saveEdit}
                    onEditCancel={cancelEdit}
                    onComplete={() => toggleComplete(t.id)}
                    onPush={() => pushTask(t.id)}
                    onDelete={() => deleteTask(t.id)}
                  />
                ))}
              </div>
            </div>
          </div>
        )}

        {/* Completed */}
        {completedTasks.length > 0 && (
          <div className="rounded-md p-4" style={{ background: COLORS.inkPanel, border: `1px solid ${COLORS.inkPanelBorder}` }}>
            <button onClick={() => setShowDone((s) => !s)} className="flex items-center gap-2 text-sm w-full" style={{ color: COLORS.textMuted }}>
              {showDone ? <ChevronUp size={15} /> : <ChevronDown size={15} />}
              {completedTasks.length} done today
            </button>
            {showDone && (
              <div className="mt-3 space-y-2">
                {completedTasks.map((t) => (
                  <div key={t.id} className="flex items-center justify-between text-sm">
                    <span className="line-through opacity-60" style={{ color: COLORS.textOnDark }}>
                      {t.title}
                    </span>
                    <div className="flex items-center gap-2">
                      <button onClick={() => toggleComplete(t.id)} className="text-xs underline" style={{ color: COLORS.textMuted }}>
                        Undo
                      </button>
                      <button onClick={() => deleteTask(t.id)} aria-label="Delete task" style={{ color: COLORS.textMuted }}>
                        <Trash2 size={14} />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Journal: plain-text entries, collapsed by default, easy to ignore.
            Deliberately kept out of the board/scoring logic entirely — these
            aren't tasks, just dated notes. */}
        {journalByNewest.length > 0 && (
          <div className="mt-8">
            <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: COLORS.textMuted }}>
              Journal
            </span>
            <div className="mt-2 space-y-2">
              {journalByNewest.map((entry) => (
                <JournalEntryBox
                  key={entry.id}
                  entry={entry}
                  onSave={(text) => updateJournalEntry(entry.id, text)}
                  onDelete={() => deleteJournalEntry(entry.id)}
                />
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AreaChip({ area, onColor }) {
  const overlay = onColor === '#211F1A' ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.22)';
  return (
    <span
      className="text-xs px-2 py-0.5 rounded-full font-medium"
      style={{ background: overlay, color: onColor }}
    >
      {area.label}
    </span>
  );
}

function PushBadge({ count }) {
  const intense = count >= 3;
  return (
    <span
      className="font-mono text-[11px] px-1.5 py-0.5 rounded-sm font-semibold"
      style={{
        background: intense ? '#B5473A' : '#B5473A22',
        color: intense ? '#FAF7F0' : '#B5473A',
      }}
    >
      pushed ×{count}
    </span>
  );
}

function ToggleChip({ active, onClick, color, label }) {
  return (
    <button
      onClick={onClick}
      className="text-xs px-2.5 py-1.5 rounded-md border font-medium"
      style={active ? { background: color, borderColor: color, color: '#14181B' } : { borderColor: '#2C3336', color: '#93999B' }}
    >
      {label}
    </button>
  );
}

/* Aggregated call/mail list: every not-yet-done task that has a phone or
   email on file, so the ordinarily-empty space next to those fields shows
   the running backlog of calls or emails still owed. */
function ContactListPanel({ title, Icon, items, field, hrefPrefix }) {
  return (
    <div className="rounded-md p-3" style={{ background: COLORS.paperDim, border: '1px solid #E3DCC9' }}>
      <div className="flex items-center gap-1.5 mb-2" style={{ color: COLORS.textMutedOnPaper }}>
        <Icon size={13} />
        <span className="text-xs uppercase tracking-wide font-semibold">{title}</span>
        <span className="font-mono text-[11px] ml-auto">{items.length}</span>
      </div>
      {items.length === 0 ? (
        <p className="text-xs italic" style={{ color: COLORS.textMutedOnPaper }}>Nothing here right now.</p>
      ) : (
        <ul className="space-y-1.5">
          {items.map((t) => (
            <li key={t.id} className="text-xs flex items-center justify-between gap-2">
              <span className="truncate" style={{ color: COLORS.textInk }} title={t.title}>
                {t.title}
              </span>
              <a
                href={`${hrefPrefix}${field === 'phone' ? t.phone.replace(/[^0-9+]/g, '') : t.email}`}
                className="underline shrink-0"
                style={{ color: COLORS.textMutedOnPaper }}
              >
                {t[field]}
              </a>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

/* Priority picker: four checkboxes in a row, left to right. Checking one
   unchecks the rest; checking an already-checked one clears it, leaving all
   four unchecked (urgent/important both null — no priority set). */
function PriorityGrid({ urgent, important, onChange, ink }) {
  const inkColor = ink || COLORS.textMutedOnPaper;
  const borderColor = ink ? `${ink}55` : '#E3DCC9';
  const options = [
    { key: 'comeOn', label: 'Come on', urgent: true, important: true, accent: COLORS.rust },
    { key: 'letsGo', label: "Let's go", urgent: false, important: true, accent: COLORS.moss },
    { key: 'tooEasy', label: 'Too easy', urgent: true, important: false, accent: COLORS.amber },
    { key: 'quitLoafing', label: 'Quit loafing', urgent: false, important: false, accent: COLORS.stone },
  ];
  return (
    <div className="flex items-center gap-2 flex-wrap">
      {options.map((o) => {
        const selected = o.urgent === urgent && o.important === important;
        return (
          <label
            key={o.key}
            className="flex items-center gap-1.5 text-xs font-medium px-2.5 py-2 rounded-md border cursor-pointer select-none"
            style={{
              background: selected ? o.accent : 'transparent',
              color: selected ? COLORS.paper : inkColor,
              borderColor: selected ? o.accent : borderColor,
            }}
          >
            <input
              type="checkbox"
              checked={selected}
              onChange={() => onChange(selected ? null : o.urgent, selected ? null : o.important)}
              style={{ accentColor: o.accent }}
            />
            {o.label}
          </label>
        );
      })}
    </div>
  );
}

function EditForm({ draft, setDraft, onSave, onCancel, ink }) {
  return (
    <div className="space-y-2">
      <input
        autoFocus
        value={draft.title}
        onChange={(e) => setDraft((d) => ({ ...d, title: e.target.value }))}
        onKeyDown={(e) => e.key === 'Enter' && onSave()}
        className="w-full text-sm px-2 py-1.5 rounded-md border"
        style={{ background: '#F0ECE1', color: '#211F1A', borderColor: '#E3DCC9' }}
      />
      <PriorityGrid
        urgent={draft.urgent}
        important={draft.important}
        onChange={(u, i) => setDraft((d) => ({ ...d, urgent: u, important: i }))}
        ink={ink}
      />
      <div className="flex items-center gap-2 flex-wrap">
        {COURSES.map((c) => (
          <ToggleChip
            key={c.key}
            active={draft.course === c.key}
            onClick={() => setDraft((d) => ({ ...d, course: d.course === c.key ? null : c.key }))}
            color={c.accent}
            label={c.label}
          />
        ))}
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        {AREAS.map((a) => {
          const active = draft.areas.includes(a.key);
          return (
            <button
              key={a.key}
              onClick={() =>
                setDraft((d) => {
                  const has = d.areas.includes(a.key);
                  if (has && d.areas.length === 1) return d;
                  return { ...d, areas: has ? d.areas.filter((k) => k !== a.key) : [...d.areas, a.key] };
                })
              }
              className="text-xs px-2 py-1 rounded-md border font-medium"
              style={active ? { background: a.color, borderColor: a.color, color: a.text } : { borderColor: ink ? `${ink}55` : '#E3DCC9', color: ink || '#7A756A' }}
            >
              {a.label}
            </button>
          );
        })}
      </div>
      <div className="flex items-center gap-2">
        <PhoneIcon size={13} />
        <input
          value={draft.phone}
          onChange={(e) => setDraft((d) => ({ ...d, phone: e.target.value }))}
          aria-label="Phone number"
          placeholder="Phone number"
          className="flex-1 text-xs px-2 py-1.5 rounded-md border"
          style={{ background: '#F0ECE1', color: '#211F1A', borderColor: '#E3DCC9' }}
        />
      </div>
      <div className="flex items-center gap-2">
        <MailIcon size={13} />
        <input
          value={draft.email}
          onChange={(e) => setDraft((d) => ({ ...d, email: e.target.value }))}
          aria-label="Email address"
          placeholder="Email address"
          className="flex-1 text-xs px-2 py-1.5 rounded-md border"
          style={{ background: '#F0ECE1', color: '#211F1A', borderColor: '#E3DCC9' }}
        />
      </div>
      <div className="flex items-center gap-2 pt-1">
        <button onClick={onSave} className="text-xs px-3 py-1 rounded-md font-medium" style={{ background: '#5C7A5E', color: '#FAF7F0' }}>
          Save
        </button>
        <button onClick={onCancel} className="text-xs px-3 py-1 rounded-md" style={{ color: ink || '#7A756A' }}>
          Cancel
        </button>
      </div>
    </div>
  );
}

function TaskCard({ task, snoozed, isEditing, editDraft, setEditDraft, onEditStart, onEditSave, onEditCancel, onComplete, onPush, onDelete }) {
  const primaryArea = areaOf(task.areas[0]);
  const quadrant = task.course
    ? COURSES.find((c) => c.key === task.course)
    : { label: primaryArea.label, sub: `${primaryArea.label} column`, accent: primaryArea.accent };
  const cardBg = quadrant.accent;
  const cardText = textColorForHex(cardBg);

  if (isEditing) {
    const editPrimaryArea = areaOf(editDraft.areas[0]);
    const editAccent = editDraft.course
      ? (COURSES.find((c) => c.key === editDraft.course) || {}).accent || editPrimaryArea.accent
      : editPrimaryArea.accent;
    const editBg = editAccent;
    const editText = textColorForHex(editAccent);
    return (
      <div
        data-task-id={task.id}
        className="task-card rounded-md p-3.5 shadow-md relative"
        style={{ background: editBg, color: editText }}
      >
        <EditForm draft={editDraft} setDraft={setEditDraft} onSave={onEditSave} onCancel={onEditCancel} ink={editText} />
      </div>
    );
  }

  return (
    <div
      data-task-id={task.id}
      className="task-card rounded-md p-3.5 shadow-md relative"
      style={{
        background: cardBg,
        color: cardText,
        opacity: snoozed ? 0.55 : 1,
      }}
    >
      <div className="flex items-start gap-2.5">
        <span
          className="task-drag-handle mt-0.5 shrink-0 opacity-60"
          title="Drag to reorder"
          aria-label="Drag to reorder"
          style={{ color: cardText, fontSize: 13, letterSpacing: 1, lineHeight: 1 }}
        >
          ⋮⋮
        </span>
        <input
          type="checkbox"
          checked={false}
          onChange={onComplete}
          aria-label="Mark done"
          title="Mark done"
          className="mt-0.5 w-4 h-4 shrink-0"
          style={{ accentColor: cardText }}
        />
        <p onClick={onEditStart} className="text-sm font-medium leading-snug flex-1 cursor-pointer" style={{ color: cardText }}>
          {task.title}
        </p>
        <button onClick={onEditStart} aria-label="Edit task" title="Edit" className="shrink-0 opacity-80" style={{ color: cardText }}>
          <PencilIcon size={14} />
        </button>
        {!snoozed && (
          <button onClick={onPush} aria-label="Push to tomorrow" title="Not today — push to tomorrow" className="shrink-0 opacity-80" style={{ color: cardText }}>
            <Clock size={14} />
          </button>
        )}
        <button onClick={onDelete} aria-label="Delete task" title="Delete" className="shrink-0 opacity-80" style={{ color: cardText }}>
          <XIcon size={14} />
        </button>
      </div>
      <div className="flex items-center gap-2 mt-2 flex-wrap pl-6">
        <span
          className="w-2 h-2 rounded-full shrink-0"
          style={{ background: quadrant.accent, boxShadow: `0 0 0 1px ${cardText === '#211F1A' ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.6)'}` }}
          title={`${quadrant.label} — ${quadrant.sub}`}
        />
        {task.areas.map((k) => (
          <AreaChip key={k} area={areaOf(k)} onColor={cardText} />
        ))}
        {task.phone && (
          <a
            href={`tel:${task.phone.replace(/[^0-9+]/g, '')}`}
            onClick={(e) => e.stopPropagation()}
            title={`Call ${task.phone}`}
            className="flex items-center gap-1 underline"
            style={{ color: cardText }}
          >
            <PhoneIcon size={12} /> {task.phone}
          </a>
        )}
        {task.email && (
          <a
            href={`mailto:${task.email}`}
            onClick={(e) => e.stopPropagation()}
            title={`Email ${task.email}`}
            className="flex items-center gap-1 underline"
            style={{ color: cardText }}
          >
            <MailIcon size={12} /> {task.email}
          </a>
        )}
        {task.pushCount > 0 && <PushBadge count={task.pushCount} />}
        {snoozed && (
          <span className="text-xs italic opacity-80" style={{ color: cardText }}>
            back tomorrow
          </span>
        )}
      </div>
    </div>
  );
}

/* Journal entry: plain, quiet, collapsed by default. Its own local state
   (collapsed / editing / draft) rather than anything in Docket()'s state,
   since nothing about a journal entry needs to be known outside its own box. */
function JournalEntryBox({ entry, onSave, onDelete }) {
  const [collapsed, setCollapsed] = useState(true);
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(entry.text);

  const dateLabel = new Date(entry.createdAt).toLocaleString(undefined, {
    weekday: 'short',
    month: 'short',
    day: 'numeric',
    hour: 'numeric',
    minute: '2-digit',
  });

  const startEdit = () => {
    setDraft(entry.text);
    setEditing(true);
    setCollapsed(false);
  };

  const save = () => {
    if (!draft.trim()) return;
    onSave(draft.trim());
    setEditing(false);
  };

  const cancel = () => {
    setDraft(entry.text);
    setEditing(false);
  };

  return (
    <div className="rounded-md px-3 py-2" style={{ background: COLORS.inkPanel, border: `1px solid ${COLORS.inkPanelBorder}` }}>
      <button
        onClick={() => setCollapsed((c) => !c)}
        className="flex items-center gap-2 text-xs w-full text-left"
        style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', color: COLORS.textMuted }}
      >
        {collapsed ? <ChevronDown size={12} /> : <ChevronUp size={12} />}
        <span className="font-mono shrink-0">{dateLabel}</span>
        {collapsed && (
          <span className="truncate opacity-70 flex-1 min-w-0 text-left">{entry.text}</span>
        )}
      </button>
      {!collapsed && (
        <div className="mt-2 pl-5">
          {editing ? (
            <div className="space-y-2">
              <textarea
                autoFocus
                value={draft}
                onChange={(e) => setDraft(e.target.value)}
                rows={4}
                className="w-full text-sm px-2 py-1.5 rounded-md border"
                style={{ background: COLORS.ink, color: COLORS.textOnDark, borderColor: COLORS.inkPanelBorder, fontFamily: 'inherit', resize: 'vertical' }}
              />
              <div className="flex items-center gap-2">
                <button onClick={save} className="text-xs px-3 py-1 rounded-md font-medium" style={{ background: COLORS.moss, color: COLORS.paper }}>
                  Save
                </button>
                <button onClick={cancel} className="text-xs px-3 py-1 rounded-md" style={{ color: COLORS.textMuted }}>
                  Cancel
                </button>
              </div>
            </div>
          ) : (
            <>
              <p className="text-sm whitespace-pre-wrap" style={{ color: COLORS.textOnDark }}>
                {entry.text}
              </p>
              <div className="flex items-center gap-3 mt-2">
                <button onClick={startEdit} className="flex items-center gap-1 text-xs opacity-70" style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', color: COLORS.textMuted }}>
                  <PencilIcon size={11} /> Edit
                </button>
                <button onClick={onDelete} className="flex items-center gap-1 text-xs opacity-70" style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', color: COLORS.textMuted }}>
                  <XIcon size={11} /> Delete
                </button>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Docket />);
</script>
</body>
</html>
