<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #390574;
    --text: #f0f0f5;
    --muted: rgba(240,240,245,0.4);
  }

  body {
    background-color: #18181c;
    background-blend-mode: overlay; 
    background-image: url("img/backie5.png");
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 3rem 2.5rem 4rem;
    cursor: default;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 3rem;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .time {
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .section-label {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 1rem;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: center;
  }

  /* Tools row sits below streaming, separated by space and a faint rule */
  .grid + .grid {
    margin-top: 2.5rem;
    padding-top: 2.5rem;
    border-top: 1px solid rgba(240,240,245,0.08);
  }

  .tile {
    flex: 0 1 328px;
    max-width: 360px;
    aspect-ratio: 16/10;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    background: #000;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tile:hover {
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .tile:active {
    transform: translateY(0) scale(0.99);
  }

  .tile:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  .tile img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
    padding: 12%;
    transition: padding 0.22s ease;
  }

  .tile:hover img {
    padding: 6%;
  }

  .tile img.contain {
    padding: 12%;
  }

  .tile:hover img.contain {
    padding: 6%;
  }

  /* Text stand-in for tiles that don't have a thumbnail yet.
     Swap the <span> for an <img> once the image exists. */
  .tile-name {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    letter-spacing: -0.02em;
    color: var(--text);
    transition: transform 0.22s ease;
  }

  .tile:hover .tile-name {
    transform: scale(1.08);
  }

  /* Sheets tile: white spreadsheet grid on green. Cells link to workbooks:
     2 workbooks = left/right halves, 3 = thirds, 4 = quadrants. */
  .tile.sheets {
    background: #188038;
    padding: 1.25rem;
    cursor: default;
    align-items: stretch;
    justify-content: stretch;
  }
  .sheets-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 3px;
    padding: 3px;
    background: #fff;           /* shows through the gaps as the grid lines */
    border-radius: 4px;
  }
  .sheets-grid a {
    background: #188038;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .sheets-grid a.zone { background: #2a9a52; }   /* rest of the hovered workbook's area */
  .sheets-grid a:hover { background: var(--hover, #fff); }   /* the cell under the mouse; color set per cell */
  .sheets-grid a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .tile, .tile img, .tile-name { transition: none; }
    .tile:hover { transform: none; }
  }
</style>
</head>
<body>

<header>
  <span class="time" id="clock"></span>
</header>

<!-- Streaming -->
<div class="grid">

  <a class="tile" title="need to pay bill" href="https://netflix.com" target="_blank">
    <img class="contain" src="img/logo-netflix.png" alt="Netflix">
  </a>

  <a class="tile" href="https://disneyplus.com" target="_blank">
    <img src="img/logo-disney.jpeg" alt="Disney+">
  </a>

  <a class="tile" href="https://max.com" target="_blank">
    <img class="contain" style="filter:invert(1)" src="img/logo-hbo.png" alt="Max">
  </a>

  <a class="tile" title="swap for Paramount+ in late June" href="https://peacocktv.com" target="_blank">
    <img src="img/logo-peacock.png" alt="Peacock">
  </a>

  <a class="tile" href="https://paramountplus.com" target="_blank">
    <img class="contain" style="filter:invert(1)" src="img/logo-paramount.png" alt="Paramount+">
  </a>

  <a class="tile" href="https://tv.apple.com" target="_blank">
    <img src="img/logo-appletv.jpeg" alt="Apple TV+">
  </a>

  <a class="tile" title="$6 credit available!" href="https://primevideo.com" target="_blank">
    <img src="img/logo-prime.png" alt="Prime Video">
  </a>

  <a class="tile" title="bundled with disney+" href="https://hulu.com" target="_blank">
    <img src="img/logo-hulu.png" alt="Hulu">
  </a>

  <a class="tile" href="https://mygreatlearning.com" target="_blank">
    <img src="img/great-learning.jpeg" alt="Great Learning">
  </a>

</div>

<!-- My tools -->
<div class="grid">

  <a class="tile" style="background:#f0e4d6" href="../runway.html" target="_blank">
    <img src="img/runway-thumb.png" alt="Runway">
  </a>

  <!-- TODO: confirm path -->
  <a class="tile" style="background:#a03a30" href="../docket.html" target="_blank">
    <img src="img/docket-thumb.png" alt="Docket">
  </a>

  <!-- TODO: confirm path to soccer hub -->
  <a class="tile" style="background:#f0e4d6" href="../soccer/" target="_blank">
    <img src="img/soccer-thumb.png" alt="Soccer">
  </a>

  <a class="tile" style="background:#bf5700" title="MSTC on Canvas" href="https://utexas.instructure.com/courses/1447036" target="_blank">
    <img src="img/mstc-thumb.png" alt="UT MSTC, McCombs Austin">
  </a>

  <!-- Google Sheets: grid built by the script at the bottom (SHEETS list) -->
  <div class="tile sheets">
    <div class="sheets-grid" id="sheets-grid"></div>
  </div>

</div>

<script>
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Workbooks on the Sheets tile (2–4). Order sets position: left→right, then top→bottom for 4.
  const SHEETS = [
    { name: 'Homework',   url: 'https://docs.google.com/spreadsheets/d/1AByybSV22BGHA61WMg_5WS7aojjfzYEX9coFDn816q0/edit' },
    { name: 'Workbook 2', url: '#' },  // TODO: second workbook
  ];

  (function buildSheetsTile() {
    const grid = document.getElementById('sheets-grid');
    const COLS = 6, ROWS = 4, n = SHEETS.length;
    const zoneOf = (c, r) =>
      n === 4 ? (r < ROWS / 2 ? 0 : 2) + (c < COLS / 2 ? 0 : 1)
              : Math.floor(c / (COLS / n));
    // Hover colors, cycled so no cell matches its neighbor (left/right/up/down).
    const HOVER = ['#ffffff', '#fbbc04', '#ea4335', '#4285f4', '#a142f4', '#24c1e0'];
    const cells = [];
    const seen = new Set();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const z = zoneOf(c, r), sheet = SHEETS[z];
        const a = document.createElement('a');
        a.href = sheet.url;
        a.target = '_blank';
        a.title = sheet.name;
        a.setAttribute('aria-label', sheet.name);
        a.dataset.zone = z;
        a.style.setProperty('--hover', HOVER[(c + 2 * r) % HOVER.length]);
        if (seen.has(z)) a.tabIndex = -1; else seen.add(z);   // one tab stop per workbook
        a.addEventListener('mouseenter', () =>
          cells.forEach(x => x.classList.toggle('zone', x.dataset.zone == z)));
        cells.push(a);
        grid.appendChild(a);
      }
    }
    grid.addEventListener('mouseleave', () => cells.forEach(x => x.classList.remove('zone')));
  })();
</script>

</body>
</html>
